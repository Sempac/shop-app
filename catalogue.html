<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The SMARTPHONE — Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --surface:#13131a;
  --card:#1a1a24;
  --border:#2a2a3a;
  --accent:#e8ff00;
  --accent2:#00d4ff;
  --text:#f0f0f0;
  --muted:#6b6b85;
  --green:#00e676;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* HERO */
.hero{
  background:linear-gradient(135deg,#0a0a0f 0%,#13131a 50%,#0d0d1a 100%);
  padding:40px 24px 32px;
  text-align:center;
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at 60% 40%,rgba(232,255,0,0.04) 0%,transparent 60%),
             radial-gradient(ellipse at 30% 70%,rgba(0,212,255,0.04) 0%,transparent 60%);
  pointer-events:none;
}
.logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;}
.logo span{color:var(--accent);}
.tagline{font-size:13px;color:var(--muted);margin-top:4px;}
.hero-addr{font-size:12px;color:var(--muted);margin-top:8px;}

/* LANGUE */
.lang-bar{
  display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
  padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);
}
.lang-btn{
  padding:4px 12px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;
  transition:all 0.2s;
}
.lang-btn:hover,.lang-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}

/* FILTRES */
.filters{
  padding:16px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;
}
.search-box{
  flex:1;min-width:200px;padding:9px 14px;background:var(--card);
  border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-size:13px;font-family:'DM Sans',sans-serif;outline:none;
  transition:border 0.2s;
}
.search-box:focus{border-color:var(--accent);}
.filter-btn{
  padding:8px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);cursor:pointer;font-size:12px;
  font-family:'DM Sans',sans-serif;transition:all 0.2s;white-space:nowrap;
}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
.count-badge{
  margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;
}

/* GRILLE */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:16px;padding:24px;
}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;transition:transform 0.2s,border-color 0.2s;cursor:pointer;
  display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-4px);border-color:var(--accent);}

/* PHOTO */
.card-photo{
  width:100%;aspect-ratio:1;background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.card-photo .no-photo{font-size:48px;opacity:0.3;}
.card-photo-upload{
  position:absolute;inset:0;background:rgba(0,0,0,0.6);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;
}
.card:hover .card-photo-upload{display:flex;}
.btn-upload{
  padding:6px 12px;background:var(--accent);color:#000;border:none;
  border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;
}
.card-photo input[type=file]{display:none;}

.card-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px;}
.card-cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.card-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;line-height:1.3;}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;}
.badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;}
.badge-cond{background:#1e3a8a;color:#93c5fd;}
.badge-grade{background:#1a2e1a;color:#86efac;}
.card-price{
  margin-top:auto;font-family:'Syne',sans-serif;font-size:20px;font-weight:800;
  color:var(--accent);
}
.card-contact{
  margin-top:8px;display:flex;gap:6px;
}
.btn-wa{
  flex:1;padding:8px;background:#25d366;color:white;border:none;
  border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.btn-call{
  padding:8px 10px;background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;font-size:14px;
}

/* EMPTY */
.empty{
  text-align:center;padding:60px 24px;color:var(--muted);
  grid-column:1/-1;
}
.empty-icon{font-size:48px;margin-bottom:12px;}

/* FOOTER */
.footer{
  text-align:center;padding:20px;color:var(--muted);font-size:12px;
  border-top:1px solid var(--border);margin-top:24px;
}

/* QR SECTION */
.qr-section{
  margin:0 24px 24px;padding:16px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.qr-box{width:80px;height:80px;background:white;border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qr-info{flex:1;min-width:180px;}
.qr-title{font-size:13px;font-weight:600;margin-bottom:4px;}
.qr-url{font-size:11px;color:var(--accent2);word-break:break-all;}

@media(max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;}
  .hero{padding:24px 16px;}
  .filters{padding:10px 12px;}
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="logo">📱 The <span>SMARTPHONE</span></div>
  <div class="tagline" id="tagline">Vente & Réparation — Paris 13e</div>
  <div class="hero-addr">📍 1 Avenue d'Italie, 75013 Paris &nbsp;|&nbsp; 📞 06 86 84 82 79</div>
</div>

<!-- LANGUES -->
<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
  <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
  <button class="lang-btn" onclick="setLang('ar')">🇸🇦 AR</button>
  <button class="lang-btn" onclick="setLang('zh')">🇨🇳 中文</button>
  <button class="lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
  <button class="lang-btn" onclick="setLang('it')">🇮🇹 IT</button>
  <button class="lang-btn" onclick="setLang('de')">🇩🇪 DE</button>
</div>

<!-- FILTRES -->
<div class="filters">
  <input class="search-box" id="searchInput" placeholder="🔍 Rechercher..." oninput="renderCatalogue()">
  <button class="filter-btn active" onclick="setFilter('all',this)" id="bt_all">Tout</button>
  <button class="filter-btn" onclick="setFilter('Smartphone',this)">📱</button>
  <button class="filter-btn" onclick="setFilter('Tablette',this)">📟</button>
  <button class="filter-btn" onclick="setFilter('Accessoire',this)">🎧</button>
  <span class="count-badge" id="countBadge"></span>
</div>

<!-- GRILLE -->
<div class="grid" id="catalogueGrid"></div>

<!-- QR CODE -->
<div class="qr-section" id="qrSection" style="display:none;">
  <div class="qr-box"><canvas id="qrCanvas"></canvas></div>
  <div class="qr-info">
    <div class="qr-title">📲 Scanner pour accéder au catalogue</div>
    <div class="qr-url" id="qrUrl"></div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  The SMARTPHONE © 2026 &nbsp;|&nbsp; 1 Avenue d'Italie, 75013 Paris<br>
  📞 01 47 07 18 66 &nbsp;|&nbsp; ✉️ smartphonesatelier4@gmail.com
</div>

<script>
/* ══ TRADUCTIONS ══ */
var LANGS = {
  fr:{tagline:'Vente & Réparation — Paris 13e',search:'Rechercher...',contact:'Nous contacter',nostock:'Aucun produit disponible',guarantee:'Garantie'},
  en:{tagline:'Buy & Repair Smartphones — Paris 13e',search:'Search...',contact:'Contact us',nostock:'No products available',guarantee:'Warranty'},
  ar:{tagline:'بيع وإصلاح الهواتف — باريس 13',search:'ابحث...',contact:'تواصل معنا',nostock:'لا توجد منتجات متاحة',guarantee:'ضمان'},
  zh:{tagline:'手机销售与维修 — 巴黎13区',search:'搜索...',contact:'联系我们',nostock:'暂无产品',guarantee:'保修'},
  es:{tagline:'Venta y Reparación — París 13',search:'Buscar...',contact:'Contáctanos',nostock:'Sin productos disponibles',guarantee:'Garantía'},
  it:{tagline:'Vendita e Riparazione — Parigi 13',search:'Cerca...',contact:'Contattaci',nostock:'Nessun prodotto disponibile',guarantee:'Garanzia'},
  de:{tagline:'Kauf & Reparatur — Paris 13',search:'Suchen...',contact:'Kontakt',nostock:'Keine Produkte verfügbar',guarantee:'Garantie'}
};

var currentLang = 'fr';
var currentFilter = 'all';
var allProducts = [];
var photos = {}; /* id → dataURL */

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  var t = LANGS[lang];
  document.getElementById('tagline').textContent = t.tagline;
  document.getElementById('searchInput').placeholder = '🔍 ' + t.search;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  renderCatalogue();
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderCatalogue();
}

/* Charger les produits */
async function loadCatalogue() {
  try {
    var res  = await fetch('/api/catalogue');
    allProducts = await res.json();
    renderCatalogue();
    genQR();
  } catch(e) {
    document.getElementById('catalogueGrid').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><div>Erreur de chargement</div></div>';
  }
}

function renderCatalogue() {
  var search = (document.getElementById('searchInput').value||'').toLowerCase();
  var t = LANGS[currentLang];

  var filtered = allProducts.filter(function(p) {
    if (currentFilter !== 'all' && p.category !== currentFilter) return false;
    if (search && !p.name.toLowerCase().includes(search) &&
        !(p.color||'').toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('countBadge').textContent = filtered.length + ' produit' + (filtered.length > 1 ? 's' : '');

  if (!filtered.length) {
    document.getElementById('catalogueGrid').innerHTML =
      '<div class="empty"><div class="empty-icon">📭</div><div>' + t.nostock + '</div></div>';
    return;
  }

  document.getElementById('catalogueGrid').innerHTML = filtered.map(function(p) {
    var photoHtml = photos[p.id]
      ? '<img src="' + photos[p.id] + '" alt="' + p.name + '">'
      : '<div class="no-photo">📱</div>';

    var condLabel = {NEUF:'Neuf',OCCASION:'Occasion',RECONDITIONNE:'Reconditionné'}[p.condition]||p.condition||'';
    var msg = encodeURIComponent('Bonjour, je suis intéressé par : ' + p.name + ' à ' + Number(p.sale_price).toFixed(0) + '€. Est-il disponible ?');

    return '<div class="card">' +
      '<div class="card-photo" id="ph_' + p.id + '">' +
        photoHtml +
        '<div class="card-photo-upload">' +
          '<label class="btn-upload" title="Ajouter une photo">📷 Photo' +
            '<input type="file" accept="image/*" onchange="uploadPhoto(' + p.id + ',this)">' +
          '</label>' +
        '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-cat">' + (p.category||'') + '</div>' +
        '<div class="card-name">' + p.name + (p.color ? ' — ' + p.color : '') + '</div>' +
        '<div class="card-badges">' +
          (condLabel ? '<span class="badge badge-cond">' + condLabel + '</span>' : '') +
          (p.grade ? '<span class="badge badge-grade">Grade ' + p.grade + '</span>' : '') +
        '</div>' +
        '<div class="card-price">' + Number(p.sale_price).toFixed(0) + ' €</div>' +
        '<div class="card-contact">' +
          '<button class="btn-wa" onclick="window.open(\'https://wa.me/33686648279?text=' + msg + '\',\'_blank\')">' +
            '💬 WhatsApp' +
          '</button>' +
          '<button class="btn-call" onclick="window.location.href=\'tel:+33686648279\'" title="Appeler">📞</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* Upload photo */
function uploadPhoto(id, input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    photos[id] = e.target.result;
    localStorage.setItem('cat_photo_' + id, e.target.result);
    renderCatalogue();
  };
  reader.readAsDataURL(file);
}

/* Charger photos sauvegardées */
function loadSavedPhotos() {
  for (var key in localStorage) {
    if (key.startsWith('cat_photo_')) {
      var id = Number(key.replace('cat_photo_',''));
      photos[id] = localStorage.getItem(key);
    }
  }
}

/* QR Code simple */
function genQR() {
  var url = window.location.href.split('?')[0];
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('qrSection').style.display = 'flex';
  /* QR via API gratuite */
  var img = document.createElement('img');
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=' + encodeURIComponent(url);
  img.style.cssText = 'width:80px;height:80px;border-radius:6px;';
  var box = document.getElementById('qrSection').querySelector('.qr-box');
  box.innerHTML = '';
  box.appendChild(img);
}

loadSavedPhotos();
loadCatalogue();
</script>
</body>
</html>
