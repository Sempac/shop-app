<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SAV - Réparations</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
.container{display:flex;height:100vh;}
.left{width:52%;border-right:1px solid #334155;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;}
.home-btn{width:100%;padding:14px;background:#1e40af;color:white;border:none;font-size:15px;font-weight:bold;border-radius:8px;cursor:pointer;font-family:Arial;}
.search-row{display:flex;gap:6px;}
.search-row input{flex:1;padding:9px 12px;border-radius:6px;border:none;font-size:13px;background:#1e293b;color:white;}
.search-row input::placeholder{color:#475569;}
.search-btn{padding:9px 16px;background:#3b82f6;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-family:Arial;}
table.rl{width:100%;border-collapse:collapse;font-size:12px;}
table.rl th{background:#1e293b;color:#94a3b8;padding:8px 10px;text-align:left;border-bottom:2px solid #334155;white-space:nowrap;}
table.rl td{padding:8px 10px;border-bottom:1px solid #1e293b;color:#e2e8f0;cursor:pointer;}
table.rl tr:hover td{background:#1e293b;}
table.rl tr.selected td{background:#1e3a8a44;}
.sbadge{font-size:10px;padding:3px 8px;border-radius:5px;font-weight:bold;display:inline-block;}
.EN_ATTENTE{background:#3b82f6;color:white;}
.EN_COURS  {background:#f59e0b;color:white;}
.TERMINE   {background:#16a34a;color:white;}
.LIVRE     {background:#7c3aed;color:white;}
.right{flex:1;padding:16px 20px;overflow:auto;}
.tabs{display:flex;gap:6px;margin-bottom:14px;}
.tab-btn{padding:9px 18px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:13px;background:#1e293b;color:#94a3b8;font-family:Arial;}
.tab-btn.active{background:#3b82f6;color:white;}
.form-section{display:none;}
.form-section.active{display:block;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg.full{grid-column:1/span 2;}
.fg label{font-size:11px;color:#94a3b8;font-weight:bold;text-transform:uppercase;}
.fg input,.fg select,.fg textarea{width:100%;padding:9px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:white;font-size:13px;font-family:Arial;}
.fg textarea{height:65px;resize:vertical;}
button{border:none;cursor:pointer;font-weight:bold;border-radius:6px;padding:9px 16px;font-size:13px;font-family:Arial;}
.btn-green{background:#22c55e;color:white;}
.btn-blue {background:#3b82f6;color:white;}
.btn-red  {background:#ef4444;color:white;}
.btn-orange{background:#f59e0b;color:white;}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
hr{border:1px solid #334155;margin:12px 0;}
.dbox{background:#1e293b;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:6px;}
.dbox .lbl{font-size:10px;color:#94a3b8;text-transform:uppercase;font-weight:bold;margin-bottom:3px;}
.contact-bar{background:#1e293b;border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.contact-bar .cname{font-size:14px;font-weight:bold;color:white;}
.contact-bar .cphone{font-size:12px;color:#94a3b8;}
.ready-badge{background:#16a34a;color:white;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:bold;}
.pay-section{background:#0f172a;border:1.5px solid #334155;border-radius:8px;padding:14px;margin-bottom:12px;}
.pay-section h4{margin:0 0 10px;font-size:12px;color:#94a3b8;text-transform:uppercase;}
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.pf label{font-size:10px;color:#94a3b8;font-weight:bold;display:block;margin-bottom:3px;}
.pf input{width:100%;padding:9px;border:1.5px solid #334155;border-radius:6px;font-size:13px;background:#1e293b;color:white;font-family:Arial;}
.pf.credit input{border-color:#f59e0b;background:#1c1407;color:#fcd34d;font-weight:bold;}
.pay-recap{margin-top:8px;font-size:11px;color:#64748b;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;}
.pay-err{font-size:11px;color:#ef4444;margin-top:5px;display:none;}
.cb-btn{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:bold;font-family:Arial;}
.cb-call{background:#16a34a;color:white;}
.cb-sms {background:#2563eb;color:white;}
.cb-wa  {background:#25d366;color:white;}

/* COMPARATEUR PRIX */
.comp-panel{display:none;position:fixed;top:0;right:0;width:460px;height:100vh;background:white;box-shadow:-4px 0 24px #0003;z-index:600;flex-direction:column;}
.comp-panel.show{display:flex;flex-direction:column;}
.comp-header{background:#0f172a;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.comp-header h3{margin:0;font-size:14px;}
.comp-close{background:#334155;color:white;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;font-family:Arial;}
.comp-body{flex:1;overflow-y:auto;padding:16px;}
.comp-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.cf label{font-size:10px;color:#64748b;font-weight:bold;text-transform:uppercase;display:block;margin-bottom:3px;}
.cf select,.cf input{width:100%;padding:8px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;}
.comp-search-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.csb{padding:6px 12px;border-radius:6px;text-decoration:none;font-size:11px;font-weight:bold;font-family:Arial;display:inline-block;background:#0f172a;color:white;}
.comp-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px;}
.comp-table th{background:#0f172a;color:white;padding:7px 10px;text-align:left;font-size:11px;}
.comp-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
.comp-table tr:hover td{background:#f8fafc;}
.comp-table tr.notre-prix td{background:#f0fdf4;font-weight:bold;}
.comp-table tr.best td{background:#fef3c7;}
.stars{color:#f59e0b;}
.add-price-form{background:#f8fafc;border-radius:8px;padding:12px;border:1.5px dashed #e2e8f0;margin-top:10px;}
.add-price-form h4{margin:0 0 10px;font-size:12px;color:#374151;}
.apf-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
.apf-grid input,.apf-grid select{padding:7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;width:100%;}
.apf-grid.full{grid-template-columns:1fr;}
.apf-btn{width:100%;padding:8px;background:#22c55e;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:12px;font-family:Arial;}
.badge-zone{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold;background:#dbeafe;color:#1e40af;}
.badge-local{background:#dcfce7;color:#166534;}
</style>
</head>
<body>
<div class="container">

<!-- LEFT -->
<div class="left">
  <button class="home-btn" onclick="location.href='index.html'">🏠 Retour Accueil</button>
  <div class="search-row">
    <input id="searchInput" placeholder="Client, tél, ID, marque, modèle...">
    <button class="search-btn" onclick="doSearch()">🔎</button>
  </div>
  <table class="rl">
    <thead><tr><th>#</th><th>Client</th><th>Tél</th><th>Marque</th><th>Modèle</th><th>Statut</th></tr></thead>
    <tbody id="repairList"></tbody>
  </table>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="tabs" style="display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;gap:6px;">
      <button class="tab-btn active" id="tabNew"    onclick="showTab('new')">➕ Nouvelle réparation</button>
      <button class="tab-btn"        id="tabDetail" onclick="showTab('detail')" style="display:none">📋 Détail / Modifier</button>
    </div>
    <button onclick="openCompetitor()" style="padding:8px 14px;background:#f59e0b;color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;font-family:Arial;">💰 Comparer prix</button>
  </div>

  <!-- NOUVELLE RÉPA -->
  <div class="form-section active" id="secNew">
    <div class="form-grid">
      <div class="fg"><label>Nom client</label><input id="n_customer" placeholder="Ex: Jean Dupont"></div>
      <div class="fg"><label>Téléphone</label><input id="n_phone" placeholder="06 XX XX XX XX"></div>
      <div class="fg"><label>Type d'appareil</label><input id="n_device" placeholder="Smartphone, Tablette, PC..."></div>
      <div class="fg"><label>Marque</label><input id="n_brand" placeholder="Apple, Samsung..."></div>
      <div class="fg"><label>Modèle</label><input id="n_model" placeholder="iPhone 14, S23..."></div>
      <div class="fg"><label>N° de série</label><input id="n_serial" placeholder="IMEI / S/N"></div>
      <div class="fg full"><label>Panne / Problème</label><input id="n_issue" placeholder="Ex: Écran cassé, batterie HS..."></div>
      <div class="fg"><label>Prix estimé (€)</label><input id="n_price" type="number" placeholder="0.00" min="0" step="0.01"></div>
      <div class="fg full"><label>Commentaire interne</label><textarea id="n_comment" placeholder="Notes..."></textarea></div>
    </div>
    <div class="btn-row">
      <button class="btn-green" onclick="createRepair()">✅ Créer réparation</button>
      <button class="btn-red"   onclick="resetForm()">🔄 Réinitialiser</button>
    </div>
  </div>

  <!-- DÉTAIL -->
  <div class="form-section" id="secDetail">
    <div id="detailView"></div>
  </div>
</div>

</div>
<script>
var currentId = null;
var selRow    = null;

function showTab(tab) {
  document.getElementById('secNew').classList.toggle('active',    tab === 'new');
  document.getElementById('secDetail').classList.toggle('active', tab === 'detail');
  document.getElementById('tabNew').classList.toggle('active',    tab === 'new');
  document.getElementById('tabDetail').classList.toggle('active', tab === 'detail');
}

/* ── LISTE ── */
async function loadRepairs() {
  var res  = await fetch('/api/repairs');
  renderList(await res.json());
}

async function doSearch() {
  var q   = document.getElementById('searchInput').value;
  var res = await fetch('/api/repairs/search?q=' + encodeURIComponent(q));
  renderList(await res.json());
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

function renderList(data) {
  var tbody = document.getElementById('repairList');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#64748b;padding:20px">Aucune réparation</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(r) {
    return '<tr data-id="' + r.id + '" class="' + (r.id === currentId ? 'selected' : '') + '">' +
      '<td><b>#' + r.id + '</b></td>' +
      '<td>' + (r.customer_name||'—') + '</td>' +
      '<td>' + (r.phone||'—') + '</td>' +
      '<td>' + (r.brand||'—') + '</td>' +
      '<td>' + (r.model||'—') + '</td>' +
      '<td><span class="sbadge ' + (r.status||'') + '">' + (r.status||'—') + '</span></td>' +
      '</tr>';
  }).join('');

  tbody.querySelectorAll('tr').forEach(function(tr) {
    tr.addEventListener('click', function() {
      if (selRow) selRow.classList.remove('selected');
      tr.classList.add('selected');
      selRow = tr;
      showRepair(Number(tr.dataset.id));
    });
  });
}

/* ── DÉTAIL ── */
async function showRepair(id) {
  currentId = id;
  var r     = await fetch('/api/repairs/' + id).then(function(x){ return x.json(); });
  document.getElementById('tabDetail').style.display = 'inline-block';
  showTab('detail');

  var fp   = Number(r.final_price||r.estimated_price||0);
  var cb   = Number(r.amount_cb||0);
  var cash = Number(r.amount_cash||0);
  var cred = Number(r.amount_credit||0);
  var phone = r.phone||'';

  var contactHtml = '';
  if (phone) {
    var intl = phone.replace(/[\s\.\-]/g,'').replace(/^0/,'33');
    var msg  = encodeURIComponent('Bonjour ' + (r.customer_name||'') + ', c\'est The SMARTPHONE. ');
    contactHtml =
      '<a class="cb-btn cb-call" href="tel:' + phone.replace(/\s/g,'') + '">📞 Appeler</a>' +
      '<a class="cb-btn cb-sms"  href="sms:' + phone.replace(/\s/g,'') + '&body=' + msg + '">💬 SMS</a>' +
      '<a class="cb-btn cb-wa"   href="https://wa.me/' + intl + '?text=' + msg + '" target="_blank">WhatsApp</a>';
  }

  document.getElementById('detailView').innerHTML =
    '<h3 style="margin-top:0;margin-bottom:10px;color:white">🔧 Réparation #' + r.id +
      ' <span class="sbadge ' + r.status + '" style="margin-left:8px">' + r.status + '</span></h3>' +

    '<div class="contact-bar">' +
      '<div><div class="cname">👤 ' + (r.customer_name||'—') + '</div>' +
      '<div class="cphone">' + (phone||'Pas de numéro') + '</div></div>' +
      contactHtml +
      (r.status === 'TERMINE' ? '<span class="ready-badge">✅ Prêt — Prévenez le client !</span>' : '') +
    '</div>' +

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">' +
      '<div class="dbox"><div class="lbl">Marque / Modèle</div>' + (r.brand||'—') + ' ' + (r.model||'') + '</div>' +
      '<div class="dbox"><div class="lbl">Type</div>' + (r.device_type||'—') + '</div>' +
      '<div class="dbox"><div class="lbl">N° série</div>' + (r.serial_number||'—') + '</div>' +
      '<div class="dbox"><div class="lbl">Prix estimé</div>' + Number(r.estimated_price||0).toFixed(2) + ' €</div>' +
      '<div class="dbox" style="grid-column:1/span 2"><div class="lbl">Panne</div>' + (r.issue||'—') + '</div>' +
      (r.comment ? '<div class="dbox" style="grid-column:1/span 2"><div class="lbl">Commentaire</div>' + r.comment + '</div>' : '') +
    '</div>' +

    '<hr><h4 style="margin:0 0 12px;color:white">✏️ Modifier</h4>' +

    '<div class="form-grid">' +
      '<div class="fg"><label>Nom client</label><input id="e_customer" value="' + (r.customer_name||'') + '"></div>' +
      '<div class="fg"><label>Téléphone</label><input id="e_phone" value="' + (r.phone||'') + '"></div>' +
      '<div class="fg"><label>Type d\'appareil</label><input id="e_device" value="' + (r.device_type||'') + '"></div>' +
      '<div class="fg"><label>Marque</label><input id="e_brand" value="' + (r.brand||'') + '"></div>' +
      '<div class="fg"><label>Modèle</label><input id="e_model" value="' + (r.model||'') + '"></div>' +
      '<div class="fg"><label>N° de série</label><input id="e_serial" value="' + (r.serial_number||'') + '"></div>' +
      '<div class="fg full"><label>Panne / Problème</label><input id="e_issue" value="' + (r.issue||'') + '"></div>' +
      '<div class="fg full"><label>Commentaire interne</label><textarea id="e_comment">' + (r.comment||'') + '</textarea></div>' +
      '<div class="fg"><label>Statut</label><select id="e_status">' +
        '<option value="EN_ATTENTE"' + (r.status==='EN_ATTENTE'?' selected':'') + '>EN_ATTENTE</option>' +
        '<option value="EN_COURS"'   + (r.status==='EN_COURS'  ?' selected':'') + '>EN_COURS</option>' +
        '<option value="TERMINE"'    + (r.status==='TERMINE'   ?' selected':'') + '>TERMINE</option>' +
        '<option value="LIVRE"'      + (r.status==='LIVRE'     ?' selected':'') + '>LIVRE</option>' +
      '</select></div>' +
      '<div class="fg"><label>Prix estimé (€)</label><input id="e_estimated" type="number" value="' + Number(r.estimated_price||0) + '" min="0" step="0.01"></div>' +
      '<div class="fg"><label>Prix final (€)</label><input id="e_final" type="number" value="' + fp + '" min="0" step="0.01" oninput="calcRepPay()"></div>' +
    '</div>' +

    '<div class="pay-section"><h4>💰 Règlement client</h4>' +
      '<div class="pay-grid">' +
        '<div class="pf"><label>💳 CB (€)</label><input type="number" id="e_cb"   value="' + cb   + '" min="0" step="0.01" oninput="calcRepPay()"></div>' +
        '<div class="pf"><label>💵 Espèces (€)</label><input type="number" id="e_cash" value="' + cash + '" min="0" step="0.01" oninput="calcRepPay()"></div>' +
        '<div class="pf credit"><label>⏳ Crédit (reste)</label><input type="number" id="e_credit" value="' + cred + '" min="0" readonly></div>' +
      '</div>' +
      '<div class="pay-recap">' +
        '<span>Prix : <b id="rp_tot">' + fp.toFixed(2) + ' €</b></span>' +
        '<span>Encaissé : <b id="rp_paid" style="color:#22c55e">' + (cb+cash).toFixed(2) + ' €</b></span>' +
        '<span>Crédit : <b id="rp_cred" style="color:#f59e0b">' + cred.toFixed(2) + ' €</b></span>' +
      '</div>' +
      '<div class="pay-err" id="rp_err">⚠️ CB + Espèces dépasse le prix !</div>' +
    '</div>' +

    '<div class="btn-row">' +
      '<button class="btn-blue"   id="btnSaveRepair">💾 Enregistrer</button>' +
      '<button class="btn-orange" id="btnPrintSAV">🧾 Ticket SAV</button>' +
      '<button class="btn-red"    id="btnDeleteRepair">🗑 Supprimer</button>' +
    '</div>';

  /* Attacher les événements */
  setTimeout(function() {
    var btnSave   = document.getElementById('btnSaveRepair');
    var btnPrint  = document.getElementById('btnPrintSAV');
    var btnDelete = document.getElementById('btnDeleteRepair');
    if (btnSave)   btnSave.addEventListener('click',   function(){ updateRepair(id); });
    if (btnPrint)  btnPrint.addEventListener('click',  function(){ printSAV(r); });
    if (btnDelete) btnDelete.addEventListener('click', function(){ deleteRepair(id); });
  }, 0);
}

function calcRepPay() {
  var total = Number(document.getElementById('e_final')?.value||0);
  var cb    = Number(document.getElementById('e_cb')?.value||0);
  var cash  = Number(document.getElementById('e_cash')?.value||0);
  var paid  = cb + cash;
  var rest  = Math.max(0, total - paid);
  if (document.getElementById('e_credit')) document.getElementById('e_credit').value = rest.toFixed(2);
  if (document.getElementById('rp_tot'))   document.getElementById('rp_tot').textContent   = total.toFixed(2) + ' €';
  if (document.getElementById('rp_paid'))  document.getElementById('rp_paid').textContent  = paid.toFixed(2)  + ' €';
  if (document.getElementById('rp_cred'))  document.getElementById('rp_cred').textContent  = rest.toFixed(2)  + ' €';
  var errEl = document.getElementById('rp_err');
  if (errEl) errEl.style.display = paid > total + 0.01 ? 'block' : 'none';
}

async function updateRepair(id) {
  var fp   = Number(document.getElementById('e_final').value||0);
  var cb   = Number(document.getElementById('e_cb').value||0);
  var cash = Number(document.getElementById('e_cash').value||0);
  if (cb + cash > fp + 0.01) { alert('⚠️ CB + Espèces dépasse le prix !'); return; }
  var credit = Math.max(0, fp - cb - cash);
  var status = document.getElementById('e_status').value;
  var res = await fetch('/api/repairs/' + id, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      status,
      final_price:     fp,
      estimated_price: Number(document.getElementById('e_estimated')?.value||0),
      customer_name:   document.getElementById('e_customer')?.value||'',
      phone:           document.getElementById('e_phone')?.value||'',
      device_type:     document.getElementById('e_device')?.value||'',
      brand:           document.getElementById('e_brand')?.value||'',
      model:           document.getElementById('e_model')?.value||'',
      serial_number:   document.getElementById('e_serial')?.value||'',
      issue:           document.getElementById('e_issue')?.value||'',
      comment:         document.getElementById('e_comment')?.value||'',
      amount_cb: cb, amount_cash: cash, amount_credit: credit
    })
  });
  var d = await res.json();
  if (d.error) { alert('❌ ' + d.error); return; }
  alert('✅ Réparation #' + id + ' mise à jour !');
  loadRepairs();
  showRepair(id);
}

async function deleteRepair(id) {
  if (!confirm('Supprimer la réparation #' + id + ' ?')) return;
  await fetch('/api/repairs/' + id, {method:'DELETE'});
  currentId = null;
  document.getElementById('detailView').innerHTML = '';
  document.getElementById('tabDetail').style.display = 'none';
  showTab('new');
  loadRepairs();
}

async function createRepair() {
  var customer = document.getElementById('n_customer').value.trim();
  if (!customer) { alert('⚠️ Nom du client obligatoire'); return; }
  var res = await fetch('/api/repairs', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      customer_name:   customer,
      phone:           document.getElementById('n_phone').value,
      device_type:     document.getElementById('n_device').value,
      brand:           document.getElementById('n_brand').value,
      model:           document.getElementById('n_model').value,
      serial_number:   document.getElementById('n_serial').value,
      issue:           document.getElementById('n_issue').value,
      estimated_price: document.getElementById('n_price').value||0,
      comment:         document.getElementById('n_comment').value,
    })
  });
  var d = await res.json();
  if (d.error) { alert('❌ ' + d.error); return; }
  alert('✅ Réparation #' + d.id + ' créée !');
  resetForm();
  loadRepairs();
  showRepair(d.id);
}

function resetForm() {
  ['n_customer','n_phone','n_device','n_brand','n_model','n_serial','n_issue','n_price','n_comment']
    .forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
}

function printSAV(r) {
  var cb   = Number(r.amount_cb||0);
  var cash = Number(r.amount_cash||0);
  var cred = Number(r.amount_credit||0);

<script>
/* ═══════════════════════════════
   COMPARATEUR PRIX RÉPARATIONS
═══════════════════════════════ */
var allCompetitors = [];
var showAddPriceForm = false;

async function openCompetitor() {
  document.getElementById('compPanel').classList.add('show');
  await loadCompetitors();
  loadCompPrices();
}

function closeCompetitor() {
  document.getElementById('compPanel').classList.remove('show');
}

async function loadCompetitors() {
  try {
    var res = await fetch('/api/repair-competitors');
    allCompetitors = await res.json();
    renderCompetitorsList();
    fillCompSelect();
    renderSearchBtns();
  } catch(e) { console.error('Erreur concurrents:', e); }
}

function fillCompSelect() {
  var sel = document.getElementById('ap_comp');
  if (!sel) return;
  sel.innerHTML = '<option value="">— Choisir —</option>' +
    allCompetitors.map(function(c) {
      return '<option value="' + c.id + '">' + (c.logo_emoji||'🔧') + ' ' + c.name + '</option>';
    }).join('');
}

function renderSearchBtns() {
  var brand = document.getElementById('comp_brand').value;
  var model = document.getElementById('comp_model').value;
  var type  = document.getElementById('comp_type').value;
  var query = [brand, model, type].filter(Boolean).join(' ');
  var div   = document.getElementById('compSearchBtns');
  div.innerHTML = allCompetitors.map(function(comp) {
    var url = comp.search_url
      ? comp.search_url.replace('{query}', encodeURIComponent(query || 'reparation smartphone'))
      : (comp.website || '#');
    return '<a href="' + url + '" target="_blank" class="csb" title="' + (comp.notes||'') + '">' +
      (comp.logo_emoji||'🔧') + ' ' + comp.name + '</a>';
  }).join('');
}

async function loadCompPrices() {
  renderSearchBtns();
  var brand = document.getElementById('comp_brand').value;
  var model = document.getElementById('comp_model').value;
  var type  = document.getElementById('comp_type').value;

  if (!brand && !model && !type) {
    document.getElementById('compBody').innerHTML =
      '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:16px">Sélectionnez un appareil ou un type de panne</td></tr>';
    document.getElementById('compCount').textContent = '';
    return;
  }

  var url = '/api/repair-prices?brand=' + encodeURIComponent(brand) +
            '&model=' + encodeURIComponent(model) +
            '&type='  + encodeURIComponent(type);
  var res    = await fetch(url);
  var prices = await res.json();

  document.getElementById('compCount').textContent = '(' + prices.length + ' prix)';

  if (!prices.length) {
    document.getElementById('compBody').innerHTML =
      '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:16px">Aucun prix enregistré — ajoutez des prix ci-dessous</td></tr>';
    return;
  }

  /* Trouver le meilleur prix concurrent */
  var bestPrice = Infinity;
  prices.forEach(function(p){ if (Number(p.price) < bestPrice) bestPrice = Number(p.price); });

  var html = prices.map(function(p) {
    var isBest = Number(p.price) === bestPrice;
    var stars  = '';
    for (var i = 0; i < 5; i++) stars += i < (p.quality_rating||3) ? '★' : '☆';
    var zone = p.zone === 'Paris 13' ?
      '<span class="badge-zone badge-local">📍 Local</span>' :
      '<span class="badge-zone">🌍 National</span>';

    return '<tr' + (isBest ? ' class="best"' : '') + '>' +
      '<td>' + (p.logo_emoji||'🔧') + ' <b>' + (p.competitor_name||'—') + '</b><br>' + zone + '</td>' +
      '<td style="font-size:11px;color:#64748b">' + (p.repair_type||'—') + '</td>' +
      '<td style="font-weight:bold;color:' + (isBest?'#d97706':'#0f172a') + '">' +
        Number(p.price||0).toFixed(2) + ' €' + (isBest?' 🏆':'') + '</td>' +
      '<td style="font-size:11px">' + (p.delay||'—') + '</td>' +
      '<td><span style="color:#f59e0b">' + stars + '</span></td>' +
      '<td><button onclick="deleteCompPrice(' + p.id + ')" style="background:#fee2e2;color:#ef4444;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:10px;font-family:Arial;">✕</button></td>' +
      '</tr>';
  }).join('');

  /* Ajouter notre prix si renseigné */
  var notreP = Number(document.getElementById('notre_prix').value||0);
  if (notreP > 0) {
    var notreD = document.getElementById('notre_delai').value || '—';
    var isBestNous = notreP <= bestPrice;
    html += '<tr class="notre-prix">' +
      '<td>🏠 <b>The SMARTPHONE</b><br><span class="badge-zone badge-local">📍 Nous</span></td>' +
      '<td style="font-size:11px;color:#64748b">' + (type||'—') + '</td>' +
      '<td style="font-weight:bold;color:#16a34a">' + notreP.toFixed(2) + ' €' + (isBestNous?' 🏆':'') + '</td>' +
      '<td style="font-size:11px">' + notreD + '</td>' +
      '<td><span style="color:#f59e0b">★★★★★</span></td>' +
      '<td></td></tr>';
  }

  document.getElementById('compBody').innerHTML = html;
}

function toggleAddPrice() {
  showAddPriceForm = !showAddPriceForm;
  document.getElementById('addPriceForm').style.display = showAddPriceForm ? 'block' : 'none';
}

async function saveCompPrice() {
  var compId = document.getElementById('ap_comp').value;
  var brand  = document.getElementById('ap_brand').value.trim();
  var model  = document.getElementById('ap_model').value.trim();
  var type   = document.getElementById('ap_type').value;
  var price  = document.getElementById('ap_price').value;
  if (!compId || !brand || !model || !price) {
    alert('Concurrent, marque, modèle et prix obligatoires');
    return;
  }
  var res = await fetch('/api/repair-prices', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      device_brand:   brand,
      device_model:   model,
      repair_type:    type,
      competitor_id:  Number(compId),
      price:          Number(price),
      delay:          document.getElementById('ap_delay').value || null,
      quality_rating: Number(document.getElementById('ap_qual').value||3)
    })
  });
  var d = await res.json();
  if (d.error) { alert('Erreur: ' + d.error); return; }
  showAddPriceForm = false;
  document.getElementById('addPriceForm').style.display = 'none';
  /* Mettre à jour les filtres et recharger */
  document.getElementById('comp_brand').value = brand;
  document.getElementById('comp_model').value = model;
  document.getElementById('comp_type').value  = type;
  loadCompPrices();
}

async function deleteCompPrice(id) {
  if (!confirm('Supprimer ce prix ?')) return;
  await fetch('/api/repair-prices/' + id, {method:'DELETE'});
  loadCompPrices();
}

function renderCompetitorsList() {
  var div = document.getElementById('competitorsList');
  div.innerHTML = allCompetitors.map(function(comp) {
    return '<div style="background:#f8fafc;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">' +
      '<div>' +
        '<div style="font-size:13px;font-weight:bold">' + (comp.logo_emoji||'🔧') + ' ' + comp.name + '</div>' +
        '<div style="font-size:11px;color:#64748b">' + (comp.zone||'National') + (comp.notes ? ' — ' + comp.notes.slice(0,40) + '...' : '') + '</div>' +
      '</div>' +
      '<div style="display:flex;gap:4px;">' +
        '<a href="' + (comp.website||'#') + '" target="_blank" style="padding:4px 9px;background:#0f172a;color:white;border-radius:5px;text-decoration:none;font-size:11px;font-weight:bold;font-family:Arial;">🌐</a>' +
        '<button onclick="deleteCompetitor(' + comp.id + ')" style="padding:4px 9px;background:#fee2e2;color:#ef4444;border:none;border-radius:5px;cursor:pointer;font-size:11px;font-family:Arial;">🗑</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function addCompetitor() {
  var name    = prompt('Nom du concurrent :');
  if (!name) return;
  var website = prompt('Site web (ex: https://www.wefix.fr) :') || '';
  var zone    = prompt('Zone (National / Paris 13 / etc.) :') || 'National';
  var emoji   = prompt('Emoji (ex: W, i, M, F...) :') || '🔧';
  var res = await fetch('/api/repair-competitors', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name, website, logo_emoji:emoji, zone})
  });
  var d = await res.json();
  if (d.error) { alert('Erreur: ' + d.error); return; }
  loadCompetitors();
}

async function deleteCompetitor(id) {
  var comp = allCompetitors.find(function(c){ return c.id === id; });
  if (!confirm('Supprimer "' + (comp?comp.name:id) + '" ?')) return;
  await fetch('/api/repair-competitors/' + id, {method:'DELETE'});
  loadCompetitors();
}

/* Mettre à jour notre prix en temps réel */
document.getElementById('notre_prix') && document.getElementById('notre_prix').addEventListener('input', loadCompPrices);
</script>

</script>

<!-- PANNEAU COMPARATEUR PRIX RÉPARATIONS -->
<div class="comp-panel" id="compPanel">
  <div class="comp-header">
    <h3>💰 Comparateur prix réparations</h3>
    <button class="comp-close" onclick="closeCompetitor()">✕ Fermer</button>
  </div>
  <div class="comp-body">
    <!-- FILTRES -->
    <div class="comp-filters">
      <div class="cf" style="grid-column:1/span 2">
        <label>Marque</label>
        <select id="comp_brand" onchange="loadCompPrices()">
          <option value="">Toutes marques</option>
          <option>Apple</option><option>Samsung</option><option>Huawei</option>
          <option>Xiaomi</option><option>OnePlus</option><option>Sony</option>
          <option>Google</option><option>Oppo</option><option>Autre</option>
        </select>
      </div>
      <div class="cf">
        <label>Modèle</label>
        <input id="comp_model" placeholder="Ex: iPhone 12" oninput="loadCompPrices()">
      </div>
      <div class="cf">
        <label>Type de panne</label>
        <select id="comp_type" onchange="loadCompPrices()">
          <option value="">Tous types</option>
          <option>Écran cassé</option>
          <option>Batterie</option>
          <option>Connecteur charge</option>
          <option>Caméra</option>
          <option>Bouton power</option>
          <option>Micro / Haut-parleur</option>
          <option>Vitre arrière</option>
          <option>Diagnostic</option>
          <option>Autre</option>
        </select>
      </div>
    </div>

    <!-- LIENS RECHERCHE DIRECTE -->
    <div style="font-size:11px;font-weight:bold;color:#64748b;margin-bottom:6px;text-transform:uppercase;">🔗 Rechercher chez les concurrents</div>
    <div class="comp-search-btns" id="compSearchBtns"></div>

    <!-- TABLEAU COMPARATIF -->
    <div style="font-size:11px;font-weight:bold;color:#64748b;margin:12px 0 6px;text-transform:uppercase;">📊 Prix enregistrés <span id="compCount" style="font-weight:normal"></span></div>
    <table class="comp-table">
      <thead>
        <tr>
          <th>Concurrent</th>
          <th>Réparation</th>
          <th>Prix</th>
          <th>Délai</th>
          <th>Note</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="compBody">
        <tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:16px">
          Sélectionnez un appareil et un type de panne
        </td></tr>
      </tbody>
    </table>

    <!-- NOTRE PRIX -->
    <div style="background:#f0fdf4;border:1.5px solid #22c55e;border-radius:8px;padding:10px 14px;margin-bottom:14px;">
      <div style="font-size:11px;font-weight:bold;color:#166534;margin-bottom:8px;">🏆 Notre prix (The SMARTPHONE)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div>
          <div style="font-size:10px;color:#64748b;margin-bottom:3px;">NOTRE PRIX (€)</div>
          <input type="number" id="notre_prix" placeholder="Ex: 65.00" min="0" step="0.01"
            style="width:100%;padding:8px;border:1.5px solid #22c55e;border-radius:6px;font-size:13px;font-family:Arial;font-weight:bold;">
        </div>
        <div>
          <div style="font-size:10px;color:#64748b;margin-bottom:3px;">DÉLAI</div>
          <input type="text" id="notre_delai" placeholder="Ex: 30 min"
            style="width:100%;padding:8px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:Arial;">
        </div>
      </div>
    </div>

    <!-- AJOUTER PRIX CONCURRENT -->
    <button onclick="toggleAddPrice()" style="width:100%;padding:9px;background:#0f172a;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;font-family:Arial;margin-bottom:8px;">
      ➕ Ajouter un prix concurrent
    </button>
    <div id="addPriceForm" style="display:none;">
      <div class="add-price-form">
        <h4>📝 Nouveau prix concurrent</h4>
        <div class="apf-grid full">
          <div>
            <label style="font-size:10px;color:#64748b;font-weight:bold;display:block;margin-bottom:3px;">CONCURRENT *</label>
            <select id="ap_comp" style="width:100%;padding:7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;">
              <option value="">— Choisir —</option>
            </select>
          </div>
        </div>
        <div class="apf-grid">
          <div>
            <label style="font-size:10px;color:#64748b;font-weight:bold;display:block;margin-bottom:3px;">MARQUE *</label>
            <input id="ap_brand" placeholder="Apple, Samsung..." style="padding:7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;width:100%;">
          </div>
          <div>
            <label style="font-size:10px;color:#64748b;font-weight:bold;display:block;margin-bottom:3px;">MODÈLE *</label>
            <input id="ap_model" placeholder="iPhone 12..." style="padding:7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;width:100%;">
          </div>
        </div>
        <div class="apf-grid">
          <div>
            <label style="font-size:10px;color:#64748b;font-weight:bold;display:block;margin-bottom:3px;">TYPE DE PANNE *</label>
            <select id="ap_type" style="padding:7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;width:100%;">
              <option>Écran cassé</option><option>Batterie</option>
              <option>Connecteur charge</option><option>Caméra</option>
              <option>Bouton power</option><option>Micro / Haut-parleur</option>
              <option>Vitre arrière</option><option>Diagnostic</option><option>Autre</option>
            </select>
          </div>
          <div>
            <label style="font-size:10px;color:#64748b;font-weight:bold;display:block;margin-bottom:3px;">PRIX (€) *</label>
            <input type="number" id="ap_price" placeholder="0.00" min="0" step="0.01" style="padding:7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;width:100%;">
          </div>
        </div>
        <div class="apf-grid">
          <div>
            <label style="font-size:10px;color:#64748b;font-weight:bold;display:block;margin-bottom:3px;">DÉLAI</label>
            <input id="ap_delay" placeholder="Ex: 1h, 24h..." style="padding:7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;width:100%;">
          </div>
          <div>
            <label style="font-size:10px;color:#64748b;font-weight:bold;display:block;margin-bottom:3px;">QUALITÉ (/5)</label>
            <select id="ap_qual" style="padding:7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:Arial;width:100%;">
              <option value="5">⭐⭐⭐⭐⭐</option>
              <option value="4">⭐⭐⭐⭐</option>
              <option value="3" selected>⭐⭐⭐</option>
              <option value="2">⭐⭐</option>
              <option value="1">⭐</option>
            </select>
          </div>
        </div>
        <button class="apf-btn" onclick="saveCompPrice()">✅ Enregistrer</button>
      </div>
    </div>

    <!-- GÉRER CONCURRENTS -->
    <div style="margin-top:16px;border-top:2px solid #f1f5f9;padding-top:14px;">
      <div style="font-size:11px;font-weight:bold;color:#64748b;margin-bottom:8px;text-transform:uppercase;">⚙️ Concurrents</div>
      <div id="competitorsList"></div>
      <button onclick="addCompetitor()" style="width:100%;padding:9px;background:#22c55e;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;font-family:Arial;margin-top:8px;">
        ➕ Ajouter un concurrent
      </button>
    </div>
  </div>
</div>
</body>
</html>
