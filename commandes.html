<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Commandes — The SMARTPHONE</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:#0f172a;color:white;height:100vh;display:flex;flex-direction:column;}
.topbar{background:#111827;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar h2{margin:0;font-size:17px;}
button{border:none;cursor:pointer;font-weight:bold;border-radius:6px;padding:9px 16px;font-size:13px;font-family:Arial;}
.btn-home{background:#1e40af;color:white;}
.btn-green{background:#22c55e;color:white;}
.btn-blue{background:#3b82f6;color:white;}
.btn-red{background:#ef4444;color:white;}
.btn-orange{background:#f59e0b;color:white;}
.btn-purple{background:#7c3aed;color:white;}
.btn-sm{padding:5px 10px;font-size:11px;}

/* TABS */
.tabs{display:flex;gap:0;background:#0f172a;border-bottom:2px solid #1e293b;flex-shrink:0;}
.tab{padding:13px 20px;border:none;background:transparent;color:#64748b;font-size:13px;font-weight:bold;cursor:pointer;font-family:Arial;border-bottom:3px solid transparent;}
.tab.active{color:white;border-bottom-color:#3b82f6;background:#1e293b;}

.main{flex:1;display:flex;overflow:hidden;}

/* LISTE */
.list-panel{width:340px;background:#111827;padding:10px;overflow-y:auto;flex-shrink:0;border-right:1px solid #1e293b;}
.search-box{display:flex;gap:6px;margin-bottom:8px;}
.search-box input,.search-box select{flex:1;padding:8px;border:1.5px solid #334155;border-radius:6px;font-size:12px;background:#1e293b;color:white;font-family:Arial;}

.cmd-card{background:#1e293b;border-radius:8px;padding:12px;margin-bottom:6px;cursor:pointer;border-left:4px solid #334155;transition:0.15s;}
.cmd-card:hover{border-left-color:#3b82f6;}
.cmd-card.active{border-left-color:#22c55e;background:#0f2d1a;}
.cc-num{font-size:12px;font-weight:bold;color:white;}
.cc-four{font-size:11px;color:#94a3b8;margin-top:2px;}
.cc-total{font-size:15px;font-weight:bold;color:#22c55e;margin-top:4px;}
.cc-date{font-size:10px;color:#64748b;}

/* STATUTS */
.st-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:bold;display:inline-block;margin-top:4px;}
.EN_ATTENTE{background:#1e3a8a;color:#93c5fd;}
.PARTIELLEMENT_RECU{background:#92400e;color:#fcd34d;}
.RECU{background:#166534;color:#86efac;}
.ANNULE{background:#374151;color:#9ca3af;}

/* DETAIL */
.detail-panel{flex:1;overflow-y:auto;padding:20px;background:#0f172a;}
.empty-detail{text-align:center;color:#475569;padding:60px 20px;}

/* FORMULAIRE */
.form-card{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:14px;}
.form-card h3{margin:0 0 14px;font-size:14px;color:white;}
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.fg label{font-size:10px;color:#64748b;font-weight:bold;text-transform:uppercase;}
.fg input,.fg select,.fg textarea{padding:9px;border:1.5px solid #334155;border-radius:7px;font-size:13px;font-family:Arial;background:#0f172a;color:white;width:100%;}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* TABLE ITEMS */
.items-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;}
.items-table th{background:#0f172a;color:#94a3b8;padding:7px 10px;text-align:left;font-size:11px;}
.items-table td{padding:7px 10px;border-bottom:1px solid #1e293b;vertical-align:middle;}
.items-table input{width:100%;padding:5px;border:1.5px solid #334155;border-radius:5px;font-size:12px;background:#0f172a;color:white;font-family:Arial;}

/* PDF UPLOAD */
.pdf-zone{border:2px dashed #334155;border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:0.2s;margin-bottom:14px;}
.pdf-zone:hover{border-color:#3b82f6;background:#1e293b;}
.pdf-zone.loaded{border-color:#22c55e;background:#0f2d1a;}

/* BESOINS */
.besoin-card{background:#1e293b;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.bc-name{font-size:13px;font-weight:bold;}
.bc-meta{font-size:11px;color:#94a3b8;margin-top:2px;}
.urgence-URGENT{color:#ef4444;font-weight:bold;}
.urgence-NORMAL{color:#94a3b8;}
.urgence-FAIBLE{color:#475569;}

/* ALERTES */
.alerte-bar{background:#92400e;border-radius:8px;padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.alerte-bar .at{font-size:13px;font-weight:bold;color:#fcd34d;}
.alerte-bar .ad{font-size:11px;color:#d97706;margin-top:2px;}
</style>
<script src="auth.js"></script>
</head>
<body>

<div class="topbar">
  <h2>🛒 Commandes Fournisseurs</h2>
  <div style="display:flex;gap:8px;">
    <button class="btn-green" onclick="showNewCommande()">➕ Nouvelle commande</button>
    <button onclick="document.getElementById('pdfImportInput').click()" style="padding:9px 14px;background:#7c3aed;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;font-family:Arial;" title="Importer une facture PDF fournisseur (LCD Phone...)">📄 Importer facture PDF</button>
    <button onclick="toggleHistorique()" id="btnHisto" style="padding:9px 14px;background:#0e7490;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;font-family:Arial;" title="Voir l'historique de toutes les lignes de commandes">📊 Historique</button>
    <input type="file" id="pdfImportInput" accept=".pdf" style="display:none" onchange="importFacturePDF(this)">
    <button class="btn-home" onclick="location.href='index.html'">🏠 Accueil</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" id="tabCommandes" onclick="switchTab('commandes')">🛒 Commandes</button>
  <button class="tab"        id="tabBesoins"   onclick="switchTab('besoins')">📋 Besoins atelier</button>
  <button class="tab"        id="tabAlertes"   onclick="switchTab('alertes')">🔔 Alertes <span id="alerteBadge" style="background:#ef4444;color:white;border-radius:10px;padding:1px 6px;font-size:10px;display:none;">0</span></button>
</div>

<!-- PANNEAU HISTORIQUE -->
<div id="histoPanel" style="display:none;padding:16px;flex:1;overflow:auto;background:#f8fafc;">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
    <input type="date" id="h_from" style="padding:6px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;" title="Date debut">
    <input type="date" id="h_to"   style="padding:6px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;" title="Date fin">
    <input type="text" id="h_search" placeholder="Fournisseur, reference..." style="padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;flex:1;min-width:180px;" oninput="renderHisto()">
    <select id="h_statut" style="padding:6px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;" onchange="renderHisto()">
      <option value="">Tous statuts</option>
      <option value="EN_ATTENTE">En attente</option>
      <option value="RECU">Recu</option>
      <option value="PARTIELLEMENT_RECU">Partiel</option>
      <option value="ANNULE">Annule</option>
    </select>
    <button onclick="renderHisto()" style="padding:6px 12px;background:#3b82f6;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-family:Arial;">Filtrer</button>
    <button onclick="exportHistoCSV()" style="padding:6px 12px;background:#16a34a;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-family:Arial;" title="Exporter en CSV pour Excel">Export CSV</button>
  </div>
  <div style="overflow:auto;background:white;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <table id="histoTable" style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead id="histoHead"></thead>
      <tbody id="histoBody"></tbody>
    </table>
  </div>
  <div id="histoTotaux" style="margin-top:10px;font-size:13px;color:#475569;"></div>
</div>

<div class="main" id="mainDiv">

  <!-- ══ TAB COMMANDES ══ -->
  <div id="tcCommandes" style="display:flex;flex:1;overflow:hidden;">
    <!-- Liste -->
    <div class="list-panel">
      <div class="search-box">
        <select id="filtreStatut" onchange="loadCommandes()">
          <option value="">Tous statuts</option>
          <option value="EN_ATTENTE">⏳ En attente</option>
          <option value="PARTIELLEMENT_RECU">📦 Partiel</option>
          <option value="RECU">✅ Reçu</option>
          <option value="ANNULE">❌ Annulé</option>
        </select>
      </div>
      <div id="commandesList">
        <div style="text-align:center;color:#475569;padding:20px;font-size:12px;">Chargement...</div>
      </div>
    </div>
    <!-- Détail -->
    <div class="detail-panel" id="commandeDetail">
      <div class="empty-detail">← Sélectionnez une commande ou créez-en une nouvelle</div>
    </div>
  </div>

  <!-- ══ TAB BESOINS ══ -->
  <div id="tcBesoins" style="display:none;flex:1;overflow-y:auto;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;font-size:15px;">📋 Besoins atelier</h3>
      <button class="btn-green" onclick="showAddBesoin()">➕ Ajouter un besoin</button>
    </div>
    <div id="besoinsList"></div>
  </div>

  <!-- ══ TAB ALERTES ══ -->
  <div id="tcAlertes" style="display:none;flex:1;overflow-y:auto;padding:16px;">
    <h3 style="margin:0 0 16px;font-size:15px;">🔔 Commandes en attente de réception</h3>
    <div id="alertesList" style="width:100%;"></div>
  </div>

</div>

<script>
var requireAuth = window.requireAuth || function(){ return {role:'gerant',name:'Admin'}; };
var user = requireAuth();

var currentCmd = null;

/* ══ TABS ══ */
function switchTab(tab) {
  ['commandes','besoins','alertes'].forEach(function(t) {
    document.getElementById('tc'+t.charAt(0).toUpperCase()+t.slice(1)).style.display = 'none';
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('active');
  });
  document.getElementById('tc'+tab.charAt(0).toUpperCase()+tab.slice(1)).style.display = 'flex';
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  if (tab === 'besoins')  loadBesoins();
  if (tab === 'alertes')  loadAlertes();
  if (tab === 'commandes') loadCommandes();
}

/* ══ COMMANDES ══ */
async function loadCommandes() {
  var statut = document.getElementById('filtreStatut').value;
  var url = '/api/commandes' + (statut ? '?statut=' + statut : '');
  try {
    var res  = await fetch(url);
    var data = await res.json();
    renderCommandesList(data);
  } catch(e) {
    document.getElementById('commandesList').innerHTML = '<div style="color:#ef4444;padding:12px;font-size:12px">Erreur: '+e.message+'</div>';
  }
}

function renderCommandesList(data) {
  var list = document.getElementById('commandesList');
  if (!data.length) {
    list.innerHTML = '<div style="text-align:center;color:#475569;padding:20px;font-size:12px">Aucune commande</div>';
    return;
  }
  var ST_LABELS = {EN_ATTENTE:'⏳ En attente',PARTIELLEMENT_RECU:'📦 Partiel',RECU:'✅ Reçu',ANNULE:'❌ Annulé'};
  list.innerHTML = data.map(function(c) {
    var isActive = currentCmd && currentCmd.id === c.id;
    var jours = Math.floor((new Date() - new Date(c.created_at)) / 86400000);
    return '<div class="cmd-card' + (isActive?' active':'') + '" onclick="loadCommande('+c.id+')">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
        '<div>' +
          '<div class="cc-num">' + (c.numero||'—') + '</div>' +
          '<div class="cc-four">🏭 ' + (c.fournisseur||'—') + '</div>' +
          '<span class="st-badge ' + c.statut + '">' + (ST_LABELS[c.statut]||c.statut) + '</span>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div class="cc-total">' + Number(c.montant_ttc||0).toFixed(2) + ' €</div>' +
          '<div class="cc-date">' + new Date(c.created_at).toLocaleDateString('fr-FR') + '</div>' +
          (c.statut === 'EN_ATTENTE' ? '<div style="font-size:10px;color:#f59e0b;">⏱ ' + jours + 'j</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function loadCommande(id) {
  var res  = await fetch('/api/commandes/' + id);
  var data = await res.json();
  currentCmd = data.commande;
  renderCommandeDetail(data);
  renderCommandesList(await (await fetch('/api/commandes')).json());
}

function renderCommandeDetail(data) {
  var cmd   = data.commande;
  var items = data.items || [];
  var panel = document.getElementById('commandeDetail');

  var ST_LABELS = {
    EN_ATTENTE:'⏳ En attente',
    PARTIELLEMENT_RECU:'📦 Partiel',
    RECU:'✅ Reçu',
    ANNULE:'❌ Annulé'
  };

  var fmt = function(n){ return Number(n||0).toFixed(2) + ' €'; };
  var fmtDate = function(d){ return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; };

  /* Tableau produits */
  var itemsHtml = items.length ? items.map(function(it) {
    var tva = it.taux_tva || 20;
    var totalHT = Number(it.prix_ht||0) * Number(it.quantite_cmd||1);
    return '<tr style="border-bottom:1px solid #f1f5f9;">' +
      '<td style="padding:7px 8px;font-size:11px;color:#64748b;font-weight:bold;">' + (it.reference||'—') + '</td>' +
      '<td style="padding:7px 8px;font-size:12px;">' + it.nom + '</td>' +
      '<td style="padding:7px 8px;text-align:center;font-size:11px;color:#64748b;">' + tva + '%</td>' +
      '<td style="padding:7px 8px;text-align:right;font-size:12px;">' + fmt(it.prix_ht) + '</td>' +
      '<td style="padding:7px 8px;text-align:center;font-weight:bold;">' + it.quantite_cmd + '</td>' +
      '<td style="padding:7px 8px;text-align:right;font-weight:bold;color:#0f172a;">' + fmt(totalHT) + '</td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="6" style="text-align:center;padding:16px;color:#94a3b8;">Aucun produit</td></tr>';

  var tvaVal = Number(cmd.montant_ttc||0) - Number(cmd.montant_ht||0);

  panel.innerHTML =
    '<div class="form-card">' +

    /* ── En-tête ── */
    '<div style="background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:14px;border:1px solid #e2e8f0;">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">' +
        '<div>' +
          '<div style="font-size:17px;font-weight:bold;color:#0f172a;">' + (cmd.numero||'—') + '</div>' +
          '<div style="font-size:13px;color:#3b82f6;font-weight:bold;margin-top:2px;">🏭 ' + (cmd.fournisseur||'—') + '</div>' +
        '</div>' +
        '<span class="st-badge ' + cmd.statut + '" title="Statut de la commande">' + (ST_LABELS[cmd.statut]||cmd.statut) + '</span>' +
      '</div>' +

      /* Dates + infos */
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:12px;">' +
        '<div style="background:white;border-radius:6px;padding:8px;border:1px solid #e2e8f0;" title="Numéro de la facture fournisseur">' +
          '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;">N° Facture</div>' +
          '<div style="font-size:13px;font-weight:bold;color:#0f172a;">' + (cmd.numero_facture||'—') + '</div>' +
        '</div>' +
        '<div style="background:white;border-radius:6px;padding:8px;border:1px solid #e2e8f0;" title="Date de la facture fournisseur">' +
          '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;">Date facture</div>' +
          '<div style="font-size:13px;font-weight:bold;color:#0f172a;">' + fmtDate(cmd.date_facture) + '</div>' +
        '</div>' +
        '<div style="background:white;border-radius:6px;padding:8px;border:1px solid #e2e8f0;" title="Date à laquelle la commande a été passée">' +
          '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;">Date commande</div>' +
          '<div style="font-size:13px;font-weight:bold;color:#0f172a;">' + fmtDate(cmd.date_commande) + '</div>' +
        '</div>' +
        '<div style="background:white;border-radius:6px;padding:8px;border:1px solid #e2e8f0;" title="Date de réception des marchandises">' +
          '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;">Date réception</div>' +
          '<div style="font-size:13px;font-weight:bold;color:#0f172a;">' + fmtDate(cmd.date_livraison_prevue) + '</div>' +
        '</div>' +
        '<div style="background:white;border-radius:6px;padding:8px;border:1px solid #e2e8f0;" title="Moyen de paiement utilisé">' +
          '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;">Paiement</div>' +
          '<div style="font-size:13px;font-weight:bold;color:#0f172a;">' + (cmd.paiement||'—') + '</div>' +
        '</div>' +
        '<div style="background:white;border-radius:6px;padding:8px;border:1px solid #e2e8f0;" title="Transporteur ou mode de livraison">' +
          '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;">Transporteur</div>' +
          '<div style="font-size:13px;font-weight:bold;color:#0f172a;">' + (cmd.transporteur||'—') + '</div>' +
        '</div>' +
      '</div>' +

      /* Montants HT | TVA | TTC */
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">' +
        '<div style="flex:1;background:#f1f5f9;border-radius:6px;padding:8px;text-align:center;" title="Montant hors taxe">' +
          '<div style="font-size:10px;color:#64748b;text-transform:uppercase;">HT</div>' +
          '<div style="font-size:15px;font-weight:bold;color:#0f172a;">' + fmt(cmd.montant_ht) + '</div>' +
        '</div>' +
        '<div style="flex:1;background:#fef9c3;border-radius:6px;padding:8px;text-align:center;" title="Montant de la TVA">' +
          '<div style="font-size:10px;color:#64748b;text-transform:uppercase;">TVA</div>' +
          '<div style="font-size:15px;font-weight:bold;color:#d97706;">' + fmt(tvaVal) + '</div>' +
        '</div>' +
        '<div style="flex:1;background:#dcfce7;border-radius:6px;padding:8px;text-align:center;" title="Montant toutes taxes comprises">' +
          '<div style="font-size:10px;color:#64748b;text-transform:uppercase;">TTC</div>' +
          '<div style="font-size:15px;font-weight:bold;color:#16a34a;">' + fmt(cmd.montant_ttc) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    /* ── Tableau produits ── */
    '<div style="font-size:12px;font-weight:bold;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">📦 Produits</div>' +
    '<div style="overflow-x:auto;">' +
    '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
      '<thead><tr style="background:#f1f5f9;border-bottom:2px solid #e2e8f0;">' +
        '<th style="padding:8px;text-align:left;" title="Référence produit fournisseur">Réf.</th>' +
        '<th style="padding:8px;text-align:left;" title="Désignation du produit">Produit</th>' +
        '<th style="padding:8px;text-align:center;" title="Taux de TVA applicable">TVA</th>' +
        '<th style="padding:8px;text-align:right;" title="Prix unitaire hors taxe">Prix HT</th>' +
        '<th style="padding:8px;text-align:center;" title="Quantité commandée">Qté</th>' +
        '<th style="padding:8px;text-align:right;" title="Total hors taxe pour cette ligne">Total HT</th>' +
      '</tr></thead>' +
      '<tbody>' + itemsHtml + '</tbody>' +
    '</table>' +
    '</div>' +

    (cmd.notes ? '<div style="margin-top:12px;padding:8px 12px;background:#f8fafc;border-radius:6px;font-size:12px;color:#64748b;border-left:3px solid #3b82f6;"><b>Notes :</b> ' + cmd.notes + '</div>' : '') +

    /* Boutons changement statut */
    '<div style="margin-top:14px;border-top:1px solid #e2e8f0;padding-top:12px;">' +
      '<div style="font-size:11px;color:#94a3b8;text-transform:uppercase;margin-bottom:8px;">Modifier le statut</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
        '<button data-id="' + cmd.id + '" data-st="EN_ATTENTE" class="st-btn" style="padding:6px 12px;background:#3b82f6;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-family:Arial;" title="En attente de réception">⏳ En attente</button>' +
        '<button data-id="' + cmd.id + '" data-st="PARTIELLEMENT_RECU" class="st-btn" style="padding:6px 12px;background:#f59e0b;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-family:Arial;" title="Commande partiellement recue">Partiel</button>' +
        '<button data-id="' + cmd.id + '" data-st="RECU" class="st-btn" style="padding:6px 12px;background:#16a34a;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-family:Arial;" title="Commande entierement recue">Recu</button>' +

        '<label style="font-size:12px;color:#64748b;">Date reception :</label>' +

        '<label style="font-size:12px;color:#64748b;">Transporteur :</label>' +
        '<input type="text" id="cmd_transporteur" value="' + (cmd.transporteur||'') + '" placeholder="Ex: Colissimo" style="padding:5px 8px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px;flex:1;" title="Nom du transporteur">' +
      '</div>' +
      '<div style="margin-top:8px;">' +
        '<label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px;">Notes :</label>' +
        '<textarea id="cmd_notes" style="width:100%;padding:6px 8px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px;font-family:Arial;resize:vertical;min-height:55px;box-sizing:border-box;" title="Ajouter ou modifier les notes" placeholder="Ajouter une note...">' + (cmd.notes||'') + '</textarea>' +
      '</div>' +
      '<div style="margin-top:6px;text-align:right;">' +
        '<button id="btnSaveCmd" data-id="' + cmd.id + '" style="padding:7px 16px;background:#0f172a;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;font-family:Arial;font-weight:bold;" title="Enregistrer date reception, transporteur et notes">Sauvegarder</button>' +
      '</div>' +
    '</div>' +
    '</div>';

  /* Event listeners */
  setTimeout(function() {
    document.querySelectorAll('.st-btn').forEach(function(btn) {
      btn.onclick = function() {
        updateCmdStatut(Number(this.dataset.id), this.dataset.st);
      };
    });
    var saveBtn = document.getElementById('btnSaveCmd');
    if (saveBtn) saveBtn.onclick = function() { saveCmdDetails(Number(this.dataset.id)); };
  }, 50);
}

async function updateCmdStatut(id, statut) {
  try {
    await fetch('/api/commandes/' + id, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({statut: statut})
    });
    loadCommande(id);
    loadCommandes();
  } catch(e) { alert('Erreur: ' + e.message); }
}

async function saveCmdDetails(id) {
  try {
    var date  = document.getElementById('cmd_date_recep')?.value || null;
    var trans = document.getElementById('cmd_transporteur')?.value || null;
    var notes = document.getElementById('cmd_notes')?.value || null;
    await fetch('/api/commandes/' + id, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({date_livraison: date, transporteur: trans, notes: notes})
    });
    loadCommande(id);
    loadCommandes();
    alert('Sauvegarde OK');
  } catch(e) { alert('Erreur: ' + e.message); }
}


/* ══ IMPORT FACTURE PDF ══ */
function closeFactureModal() {
  var m = document.getElementById('factureModal');
  if (m) m.remove();
}

var _factureData = null;

async function importFacturePDF(input) {
  var file = input.files[0];
  if (!file) return;
  input.value = '';
  var formData = new FormData();
  formData.append('pdf', file);
  try {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:#000a;z-index:9999;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;font-family:Arial;';
    overlay.innerHTML = 'Analyse de la facture en cours...';
    document.body.appendChild(overlay);
    var res  = await fetch('/api/import-facture-pdf/upload', {method:'POST', body:formData});
    var data = await res.json();
    overlay.remove();
    if (data.error) { alert('Erreur: ' + data.error); return; }
    if (!data.items || !data.items.length) { alert('Aucun produit detecte'); return; }
    showFacturePreview(data);
  } catch(e) {
    document.querySelectorAll('[style*="position:fixed"]').forEach(function(el){ el.remove(); });
    alert('Erreur: ' + e.message);
  }
}

function showFacturePreview(data) {
  _factureData = data;
  var modal = document.createElement('div');
  modal.id  = 'factureModal';
  modal.style.cssText = 'position:fixed;inset:0;background:#000c;z-index:9999;display:flex;align-items:center;justify-content:center;font-family:Arial;';

  var rows = (data.items||[]).map(function(it) {
    return '<tr style="border-bottom:1px solid #e2e8f0;">' +
      '<td style="padding:8px;font-size:12px;color:#475569;font-family:Arial;">' + it.reference + '</td>' +
      '<td style="padding:8px;font-size:12px;color:#0f172a;font-family:Arial;">' + it.nom + '</td>' +
      '<td style="padding:8px;text-align:center;color:#0f172a;font-family:Arial;">' + it.quantite + '</td>' +
      '<td style="padding:8px;text-align:right;font-weight:bold;color:#0f172a;font-family:Arial;">' + Number(it.prix_ht).toFixed(2) + ' €</td>' +
    '</tr>';
  }).join('');

  modal.innerHTML =
    '<div style="background:white;border-radius:14px;padding:24px;max-width:700px;width:95vw;max-height:90vh;overflow-y:auto;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
        '<div>' +
          '<div style="font-size:18px;font-weight:bold;color:#0f172a;">Facture #' + data.numero + '</div>' +
          '<div style="font-size:12px;color:#64748b;">' + data.fournisseur + ' - ' + data.date + '</div>' +
        '</div>' +
        '<button id="btnCloseFacture" style="background:#ef4444;color:white;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;">X</button>' +
      '</div>' +
      '<table style="width:100%;border-collapse:collapse;">' +
        '<thead><tr style="background:#f1f5f9;">' +
          '<th style="padding:8px;text-align:left;color:#0f172a;font-family:Arial;">Ref.</th>' +
          '<th style="padding:8px;text-align:left;color:#0f172a;font-family:Arial;">Produit</th>' +
          '<th style="padding:8px;text-align:center;color:#0f172a;font-family:Arial;">Qte</th>' +
          '<th style="padding:8px;text-align:right;color:#0f172a;font-family:Arial;">Prix HT</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid #e2e8f0;">' +
        '<div style="font-size:13px;color:#0f172a;">HT : <b>' + Number(data.total_ht||0).toFixed(2) + ' €</b> | TTC : <b>' + Number(data.total_ttc||0).toFixed(2) + ' €</b></div>' +
        '<div style="display:flex;gap:8px;">' +
          '<button id="btnAnnulerFacture" style="padding:9px 16px;background:#64748b;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;">Annuler</button>' +
          '<button id="btnImporterFacture" style="padding:9px 16px;background:#16a34a;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;">Importer comme depense</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.body.appendChild(modal);
  document.getElementById('btnCloseFacture').onclick  = closeFactureModal;
  document.getElementById('btnAnnulerFacture').onclick = closeFactureModal;
  document.getElementById('btnImporterFacture').onclick = importerFactureEnCommande;
}

async function importerFactureEnCommande() {
  var data = _factureData;
  if (!data) return;
  closeFactureModal();
  try {
    var date = data.date ? data.date.split('/').reverse().join('-') : new Date().toISOString().split('T')[0];

    await fetch('/api/commandes', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        fournisseur:    'LCD Phone',
        numero_facture: data.numero,
        date_commande:  date,
        date_facture:   date,
        montant_ht:     data.total_ht || 0,
        montant_ttc:    data.total_ttc || data.total_ht || 0,
        statut:         'RECU',
        transporteur:   data.transporteur || '',
        notes:          'Import facture PDF #' + data.numero,
        items: data.items.map(function(it){
          return {
            reference:    it.reference,
            nom:          it.nom,
            categorie:    'Piece detachee',
            quantite_cmd: it.quantite,
            prix_ht:      it.prix_ht,
            prix_ttc:     it.prix_ht * 1.20,
            prix_vente:   0
          };
        })
      })
    });

    for (var i = 0; i < data.items.length; i++) {
      var it = data.items[i];
      var ttc_ligne = it.prix_ht * it.quantite * 1.20;
      await fetch('/api/expenses', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          description: '[LCD Phone #' + data.numero + '] ' + it.reference + ' - ' + it.nom,
          amount:      ttc_ligne,
          amount_ht:   it.prix_ht * it.quantite,
          amount_ttc:  ttc_ligne,
          taux_tva:    20,
          category:    'Fournisseur',
          date:        date
        })
      });
    }

    alert(data.items.length + ' ligne(s) importees - Commande et Depenses creees !');
    loadCommandes();
  } catch(e) { alert('Erreur: ' + e.message); }
}


/* ══ HISTORIQUE COMMANDES ══ */
var _histoData = [];

function toggleHistorique() {
  var panel  = document.getElementById('histoPanel');
  var main   = document.getElementById('mainDiv');
  var btn    = document.getElementById('btnHisto');
  var isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'flex';
  panel.style.flexDirection = 'column';
  main.style.display  = isOpen ? 'flex' : 'none';
  btn.style.background = isOpen ? '#0e7490' : '#0f172a';
  if (!isOpen) loadHisto();
}

async function loadHisto() {
  try {
    var res  = await fetch('/api/commandes');
    var cmds = await res.json();
    /* Charger aussi les items de chaque commande */
    _histoData = [];
    for (var cmd of cmds) {
      var r2    = await fetch('/api/commandes/' + cmd.id);
      var data  = await r2.json();
      var items = data.items || [];
      if (items.length === 0) {
        _histoData.push({cmd: cmd, item: null});
      } else {
        items.forEach(function(it) {
          _histoData.push({cmd: cmd, item: it});
        });
      }
    }
    renderHisto();
  } catch(e) { console.error('Histo:', e); }
}

function renderHisto() {
  var search = (document.getElementById('h_search')?.value||'').toLowerCase();
  var from   = document.getElementById('h_from')?.value || '';
  var to     = document.getElementById('h_to')?.value || '';
  var statut = document.getElementById('h_statut')?.value || '';

  var filtered = _histoData.filter(function(row) {
    var cmd = row.cmd;
    var it  = row.item;
    if (statut && cmd.statut !== statut) return false;
    if (from && cmd.date_commande && cmd.date_commande.slice(0,10) < from) return false;
    if (to   && cmd.date_commande && cmd.date_commande.slice(0,10) > to)   return false;
    if (search) {
      var hay = [cmd.numero, cmd.fournisseur, cmd.numero_facture,
                 it ? it.reference : '', it ? it.nom : ''].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  var fmt = function(n){ return Number(n||0).toFixed(2) + ' EUR'; };
  var fmtDate = function(d){ return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; };

  var ST = {EN_ATTENTE:'En attente', RECU:'Recu', PARTIELLEMENT_RECU:'Partiel', ANNULE:'Annule'};
  var headRow = '<tr style="background:#f1f5f9;border-bottom:2px solid #e2e8f0;">' +
    '<th style="padding:8px;text-align:left;">N° Cmd</th>' +
    '<th style="padding:8px;text-align:left;">N° Facture</th>' +
    '<th style="padding:8px;text-align:left;">Fournisseur</th>' +
    '<th style="padding:8px;text-align:left;">Date cmd</th>' +
    '<th style="padding:8px;text-align:left;">Date recep.</th>' +
    '<th style="padding:8px;text-align:left;">Statut</th>' +
    '<th style="padding:8px;text-align:left;">Ref.</th>' +
    '<th style="padding:8px;">Produit</th>' +
    '<th style="padding:8px;text-align:center;">Qte</th>' +
    '<th style="padding:8px;text-align:right;">Prix HT</th>' +
    '<th style="padding:8px;text-align:right;">Total HT</th>' +
    '<th style="padding:8px;text-align:left;">Transporteur</th>' +
  '</tr>';

  document.getElementById('histoHead').innerHTML = headRow;

  var totalHT = 0;
  var rows = filtered.map(function(row) {
    var cmd = row.cmd;
    var it  = row.item;
    var ht  = it ? Number(it.prix_ht||0) * Number(it.quantite_cmd||1) : 0;
    totalHT += ht;
    return '<tr style="border-bottom:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;">' +
      '<td style="padding:7px 8px;font-size:11px;color:#3b82f6;font-weight:bold;cursor:pointer;" onclick="toggleHistorique();loadCommande(' + cmd.id + ')">' + (cmd.numero||'—') + '</td>' +
      '<td style="padding:7px 8px;font-size:11px;">' + (cmd.numero_facture||'—') + '</td>' +
      '<td style="padding:7px 8px;font-size:12px;font-weight:bold;">' + (cmd.fournisseur||'—') + '</td>' +
      '<td style="padding:7px 8px;font-size:11px;">' + fmtDate(cmd.date_commande) + '</td>' +
      '<td style="padding:7px 8px;font-size:11px;">' + fmtDate(cmd.date_livraison_prevue) + '</td>' +
      '<td style="padding:7px 8px;">' +
        '<span style="padding:2px 8px;border-radius:4px;font-size:10px;font-weight:bold;background:' +
          ({EN_ATTENTE:'#dbeafe',RECU:'#dcfce7',PARTIELLEMENT_RECU:'#fef9c3',ANNULE:'#fee2e2'}[cmd.statut]||'#f1f5f9') + ';color:' +
          ({EN_ATTENTE:'#1e40af',RECU:'#166534',PARTIELLEMENT_RECU:'#854d0e',ANNULE:'#991b1b'}[cmd.statut]||'#475569') + ';">' +
          (ST[cmd.statut]||cmd.statut) + '</span>' +
      '</td>' +
      '<td style="padding:7px 8px;font-size:11px;color:#475569;">' + (it ? it.reference||'—' : '—') + '</td>' +
      '<td style="padding:7px 8px;font-size:12px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="' + (it ? it.nom : '') + '">' + (it ? it.nom : '—') + '</td>' +
      '<td style="padding:7px 8px;text-align:center;">' + (it ? it.quantite_cmd : '—') + '</td>' +
      '<td style="padding:7px 8px;text-align:right;">' + (it ? fmt(it.prix_ht) : '—') + '</td>' +
      '<td style="padding:7px 8px;text-align:right;font-weight:bold;">' + (it ? fmt(ht) : '—') + '</td>' +
      '<td style="padding:7px 8px;font-size:11px;color:#64748b;">' + (cmd.transporteur||'—') + '</td>' +
    '</tr>';
  }).join('');

  document.getElementById('histoBody').innerHTML = rows || '<tr><td colspan="12" style="text-align:center;padding:20px;color:#94a3b8;">Aucun resultat</td></tr>';
  document.getElementById('histoTotaux').innerHTML =
    '<b>' + filtered.length + '</b> lignes affichees — Total HT : <b>' + fmt(totalHT) + '</b>';
}

function exportHistoCSV() {
  var headers = ['N Cmd','N Facture','Fournisseur','Date commande','Date reception','Statut','Reference','Produit','Quantite','Prix HT','Total HT','Transporteur'];
  var fmt = function(n){ return Number(n||0).toFixed(2); };
  var fmtDate = function(d){ return d ? new Date(d).toLocaleDateString('fr-FR') : ''; };
  var ST = {EN_ATTENTE:'En attente', RECU:'Recu', PARTIELLEMENT_RECU:'Partiel', ANNULE:'Annule'};

  var search = (document.getElementById('h_search')?.value||'').toLowerCase();
  var from   = document.getElementById('h_from')?.value || '';
  var to     = document.getElementById('h_to')?.value || '';
  var statut = document.getElementById('h_statut')?.value || '';

  var filtered = _histoData.filter(function(row) {
    var cmd = row.cmd;
    var it  = row.item;
    if (statut && cmd.statut !== statut) return false;
    if (from && cmd.date_commande && cmd.date_commande.slice(0,10) < from) return false;
    if (to   && cmd.date_commande && cmd.date_commande.slice(0,10) > to)   return false;
    if (search) {
      var hay = [cmd.numero, cmd.fournisseur, cmd.numero_facture,
                 it ? it.reference : '', it ? it.nom : ''].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  var csv = [headers.join(';')].concat(filtered.map(function(row) {
    var c = row.cmd;
    var it = row.item;
    return [
      c.numero||'', c.numero_facture||'', c.fournisseur||'',
      fmtDate(c.date_commande), fmtDate(c.date_livraison_prevue),
      ST[c.statut]||c.statut,
      it ? it.reference||'' : '',
      it ? (it.nom||'').replace(/;/g,',') : '',
      it ? it.quantite_cmd : '',
      it ? fmt(it.prix_ht) : '',
      it ? fmt(Number(it.prix_ht||0)*Number(it.quantite_cmd||1)) : '',
      c.transporteur||''
    ].join(';');
  })).join('\n');

  var blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = url;
  a.download = 'historique_commandes_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}


async function loadAlertes() {
  try {
    var res  = await fetch('/api/commandes?statut=EN_ATTENTE');
    var cmds = await res.json();
    var res2 = await fetch('/api/commandes?statut=PARTIELLEMENT_RECU');
    var cmds2 = await res2.json();
    var all  = cmds.concat(cmds2);
    var now  = new Date();

    var list = document.getElementById('alertesList');
    if (!list) return;

    if (!all.length) {
      list.innerHTML = '<div style="color:#64748b;font-size:13px;text-align:center;padding:30px;">Aucune commande en attente ✅</div>';
      return;
    }

    var fmtDate = function(d){ return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; };

    list.innerHTML = all.map(function(cmd) {
      var dateRef   = cmd.date_commande || cmd.created_at;
      var d         = new Date(dateRef);
      var dateLocal = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      var nowLocal  = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var jours     = Math.floor((nowLocal - dateLocal) / 86400000);
      var cls  = jours >= 7 ? '#dc2626' : jours >= 3 ? '#d97706' : '#16a34a';
      var bg   = jours >= 7 ? '#1a0505' : jours >= 3 ? '#1c1205' : '#052e16';
      var emoji = jours >= 7 ? '🔴' : jours >= 3 ? '🟡' : '🟢';
      var statLabel = cmd.statut === 'PARTIELLEMENT_RECU' ? 'Partiellement reçue' : 'En attente';
      var divStyle = 'display:flex;align-items:center;justify-content:space-between;background:' + bg + ';border:1px solid ' + cls + ';border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;';
      return '<div style="' + divStyle + '" data-id="' + cmd.id + '" class="alerte-cmd-row">' +
        '<div>' +
          '<div style="font-weight:bold;font-size:13px;color:white;">' + emoji + ' ' + (cmd.numero||'—') + ' — ' + (cmd.fournisseur||'—') + (cmd.numero_facture ? ' | Facture #' + cmd.numero_facture : '') + '</div>' +
          '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">' + statLabel + ' · Date commande : ' + fmtDate(cmd.date_commande) + ' · ' + jours + ' jour' + (jours > 1 ? 's' : '') + ' sans réception</div>' +
        '</div>' +
        '<div style="font-size:22px;font-weight:900;color:' + cls + ';">' + jours + 'j</div>' +
      '</div>';
    }).sort(function(a,b){ return 0; }).join('');
  } catch(e) {
    console.error('loadAlertes:', e);
  }
  /* Event listeners */
  setTimeout(function() {
    document.querySelectorAll('.alerte-cmd-row').forEach(function(el) {
      el.onclick = function() {
        var id = Number(this.dataset.id);
        switchTab('commandes');
        loadCommande(id);
      };
    });
  }, 50);
}
