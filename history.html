<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Historique ventes</title>
<style>
body{margin:0;font-family:Arial;display:flex;height:100vh;}
.left{width:40%;background:#0f172a;color:white;padding:15px;overflow-y:auto;}
input,select{width:100%;padding:10px;margin-bottom:8px;box-sizing:border-box;border:1px solid #334155;border-radius:6px;background:#1e293b;color:white;font-family:Arial;}
input::placeholder{color:#475569;}
button{width:100%;padding:10px;margin-bottom:10px;border:none;cursor:pointer;font-weight:bold;border-radius:6px;font-family:Arial;}
.home-btn{padding:14px!important;background:#1e40af;color:white;font-size:15px;margin-bottom:12px;}
.search-btn{background:#3b82f6;color:white;}
.reset-btn{background:#ef4444;color:white;}
.compta-btn{background:#7c3aed;color:white;}
.item{background:#111827;padding:10px;margin-bottom:5px;cursor:pointer;border-radius:6px;font-size:13px;border-left:3px solid transparent;}
.item:hover{background:#1e293b;border-left-color:#3b82f6;}
label{color:#94a3b8;font-size:11px;font-weight:bold;text-transform:uppercase;display:block;margin-bottom:3px;}

.right{flex:1;padding:20px;overflow-y:auto;background:#f8fafc;}
.order-header{background:white;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0001;}
.order-header h3{margin:0 0 10px;font-size:16px;color:#0f172a;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.info-box{background:#f1f5f9;border-radius:6px;padding:10px;font-size:13px;}
.info-box .lbl{font-size:10px;color:#64748b;font-weight:bold;text-transform:uppercase;margin-bottom:3px;}
.info-box .val{font-weight:bold;color:#0f172a;}
.info-box.cb{background:#eff6ff;border:1px solid #bfdbfe;}
.info-box.esp{background:#f0fdf4;border:1px solid #bbf7d0;}
.info-box.credit{background:#fffbeb;border:1px solid #fde68a;}

/* Barre contact */
.contact-bar{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.contact-bar .cname{font-size:13px;font-weight:bold;color:#0f172a;}
.contact-bar .cphone{font-size:12px;color:#475569;}

table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px #0001;}
th{background:#111827;color:white;padding:10px 12px;text-align:left;font-size:12px;}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:13px;}
.total{margin-top:12px;font-size:20px;font-weight:bold;text-align:right;background:white;border-radius:8px;padding:12px 16px;box-shadow:0 1px 4px #0001;}
.empty{text-align:center;color:#94a3b8;padding:30px;font-size:13px;}
</style>
<script src="contact-buttons.js"></script>
</head>
<body>

<div class="left">
  <button class="home-btn" onclick="location.href='index.html'">🏠 Retour Accueil</button>
  <h3 style="margin:0 0 12px;font-size:15px">🔍 Recherche ventes</h3>
  <label>ID vente</label><input id="id" placeholder="Ex: 101">
  <label>Date min</label><input id="date_min" type="date">
  <label>Date max</label><input id="date_max" type="date">
  <label>Paiement</label>
  <select id="payment">
    <option value="">Tous</option>
    <option value="card">💳 Carte (CB)</option>
    <option value="cash">💵 Espèces</option>
    <option value="mixed">🔀 Mixte</option>
    <option value="credit">📋 Crédit</option>
  </select>
  <label>Client</label><input id="customer" placeholder="Nom du client">
  <button class="search-btn" onclick="searchOrders()">🔎 Rechercher</button>
  <button class="reset-btn"  onclick="resetFilters()">♻ Réinitialiser</button>
  <button class="compta-btn" onclick="location.href='rapport-comptable.html'">📋 Rapport comptable</button>
  <div id="list" style="margin-top:10px"></div>
</div>

<div class="right">
  <h2 style="margin:0 0 16px;color:#0f172a">Détail vente</h2>
  <div id="detail"><div class="empty">← Sélectionnez une vente dans la liste</div></div>
</div>

<script>
let current=null;
const fmt=n=>Number(n||0).toFixed(2)+' €';

function pmLabel(pm){
  const m=(pm||'').toLowerCase();
  if(m==='card'||m==='cb')    return '💳 Carte (CB)';
  if(m==='cash'||m==='esp')   return '💵 Espèces';
  if(m==='mixed'||m==='mixte')return '🔀 Mixte';
  if(m==='credit')            return '📋 Crédit';
  return pm||'—';
}

function resetFilters(){
  ['id','date_min','date_max','customer'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('payment').value='';
  document.getElementById('list').innerHTML='';
  document.getElementById('detail').innerHTML='<div class="empty">← Sélectionnez une vente</div>';
  current=null;
}

async function searchOrders(){
  const params=new URLSearchParams();
  const id=document.getElementById('id').value.trim();
  const dateMin=document.getElementById('date_min').value;
  const dateMax=document.getElementById('date_max').value;
  const payment=document.getElementById('payment').value;
  const customer=document.getElementById('customer').value;
  if(id)      params.append('id',id);
  if(dateMin) params.append('date_min',dateMin);
  if(dateMax) params.append('date_max',dateMax);
  if(payment) params.append('payment',payment);
  if(customer)params.append('customer',customer);
  try{
    const res=await fetch('/api/orders/search?'+params.toString());
    const data=await res.json();
    const list=document.getElementById('list');
    list.innerHTML='';
    if(!data.length){list.innerHTML='<p style="color:#64748b;font-size:13px">Aucune vente trouvée</p>';return;}
    data.forEach(o=>{
      const div=document.createElement('div');
      div.className='item';
      div.innerHTML=`
        <b>#${o.id}</b> — ${o.customer_name||'CLIENT'}<br>
        <span style="color:#94a3b8;font-size:12px">${pmLabel(o.payment_method)} · <b style="color:#22c55e">${fmt(o.total)}</b> · ${new Date(o.created_at).toLocaleDateString('fr-FR')}</span>`;
      div.onclick=()=>loadOrder(o.id);
      list.appendChild(div);
    });
  }catch(e){alert('❌ Erreur : '+e.message);}
}

async function loadOrder(id){
  try{
    const res=await fetch('/api/orders/'+id);
    const data=await res.json();
    current=data;
    const o=data.order;
    const cb=Number(o.amount_cb||0);
    const cash=Number(o.amount_cash||0);
    const cred=Number(o.amount_credit||0);
    let total=0;
    const rows=data.items.map(i=>{
      const line=(Number(i.price)*Number(i.quantity))-(Number(i.discount||0)*Number(i.quantity));
      total+=line;
      return `<tr>
        <td>${i.name}</td>
        <td style="text-align:center">${i.quantity}</td>
        <td style="text-align:right">${Number(i.price).toFixed(2)} €</td>
        <td style="text-align:right">${Number(i.discount||0).toFixed(2)} €</td>
        <td style="text-align:right;font-weight:bold">${line.toFixed(2)} €</td>
      </tr>`;
    }).join('');

    /* Barre contact client si numéro disponible */
    const customerPhone = o.customer_phone || '';
    const contactHtml = o.customer_name && o.customer_name !== 'CLIENT'
      ? `<div class="contact-bar">
           <div>
             <div class="cname">👤 ${o.customer_name}</div>
             ${customerPhone?`<div class="cphone">${customerPhone}</div>`:''}
           </div>
           ${customerPhone ? contactButtons(customerPhone, o.customer_name) : '<span style="font-size:12px;color:#94a3b8">Pas de numéro enregistré</span>'}
         </div>` : '';

    document.getElementById('detail').innerHTML=`
      <div class="order-header">
        <h3>Vente #${o.id}</h3>
        ${contactHtml}
        <div class="info-grid">
          <div class="info-box"><div class="lbl">Client</div><div class="val">${o.customer_name||'CLIENT'}</div></div>
          <div class="info-box"><div class="lbl">Date</div><div class="val">${new Date(o.created_at).toLocaleString('fr-FR')}</div></div>
          <div class="info-box"><div class="lbl">Paiement</div><div class="val">${pmLabel(o.payment_method)}</div></div>
          <div class="info-box"><div class="lbl">Total</div><div class="val" style="color:#16a34a;font-size:16px">${fmt(o.total)}</div></div>
          ${cb>0   ?`<div class="info-box cb">  <div class="lbl">💳 Payé CB</div>      <div class="val">${fmt(cb)}</div></div>`:''}
          ${cash>0 ?`<div class="info-box esp"> <div class="lbl">💵 Payé Espèces</div> <div class="val">${fmt(cash)}</div></div>`:''}
          ${cred>0 ?`<div class="info-box credit"><div class="lbl">⏳ Reste à payer</div><div class="val" style="color:#f59e0b">${fmt(cred)}</div></div>`:''}
          ${o.comment?`<div class="info-box" style="grid-column:1/span 2"><div class="lbl">💬 Commentaire</div><div class="val">${o.comment}</div></div>`:''}
        </div>
        <div style="display:flex;gap:8px">
          <button onclick="printInvoice()" style="flex:1;padding:10px;background:#111827;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-family:Arial">🖨️ Réimprimer facture</button>
          <button onclick="printTicket()"  style="flex:1;padding:10px;background:#475569;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-family:Arial">🧾 Ticket 80mm</button>
          <button onclick="deleteOrder(${o.id})" style="padding:10px 14px;background:#ef4444;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-family:Arial">🗑</button>
        </div>
      </div>
      <table>
        <thead><tr><th>Produit</th><th style="text-align:center">Qté</th><th style="text-align:right">Prix</th><th style="text-align:right">Remise</th><th style="text-align:right">Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="total">TOTAL : ${total.toFixed(2)} €</div>`;
  }catch(e){alert('❌ Erreur : '+e.message);}
}

async function deleteOrder(id){
  if(!confirm('Supprimer la vente #'+id+' ?\nLe stock sera remis à jour.'))return;
  const res=await fetch('/api/orders/'+id,{method:'DELETE'});
  const d=await res.json();
  if(d.error){alert('❌ '+d.error);return;}
  alert('✅ Vente #'+id+' supprimée');
  document.getElementById('detail').innerHTML='<div class="empty">← Sélectionnez une vente</div>';
  searchOrders();
}

function printInvoice(){if(!current)return;/* même fonction que sales.html */alert('Utilisez le bouton depuis la page de vente pour réimprimer.');}
function printTicket() {if(!current)return;alert('Utilisez le bouton depuis la page de vente pour réimprimer.');}

const today=new Date().toISOString().slice(0,10);
document.getElementById('date_min').value=today;
document.getElementById('date_max').value=today;
searchOrders();
</script>
</body>
</html>
