<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dépenses — The SMARTPHONE</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:#f1f5f9;}
.topbar{background:#111827;color:white;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar h2{margin:0;font-size:18px;}
.home-btn{padding:10px 20px;background:#1e40af;color:white;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;}
.container{display:grid;grid-template-columns:1fr 1.6fr;gap:20px;padding:20px;max-width:1200px;margin:0 auto;}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 4px #0001;}
.card h3{margin:0 0 16px;font-size:16px;color:#0f172a;border-bottom:2px solid #f1f5f9;padding-bottom:10px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.fg label{font-size:11px;color:#64748b;font-weight:bold;text-transform:uppercase;}
.fg input,.fg select,.fg textarea{padding:10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:Arial;width:100%;}
.btn-add{width:100%;padding:12px;background:#22c55e;color:white;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:4px;}
.btn-add:hover{background:#16a34a;}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filters input,.filters select{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:Arial;}
table{width:100%;border-collapse:collapse;}
th{background:#0f172a;color:white;padding:10px 12px;text-align:left;font-size:12px;}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:13px;}
tr:hover td{background:#f8fafc;}
.cat-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:bold;background:#f1f5f9;color:#374151;}
.total-bar{background:#0f172a;color:white;border-radius:10px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.total-bar span{font-size:20px;font-weight:bold;color:#f59e0b;}
.del-btn{background:#fee2e2;color:#ef4444;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;}
.role-notice{background:#fef3c7;border:1.5px solid #f59e0b;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:12px;display:none;}
@media print{.home-btn,.btn-add,.fg,.del-btn,.filters,.no-print{display:none!important;}body{background:white;}}
</style>
<script src="auth.js"></script>
</head>
<body>
<div class="topbar">
  <h2>📉 Dépenses</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button onclick="window.print()" style="padding:10px 14px;background:#475569;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;font-family:Arial;">🖨️ Imprimer</button>
    <button onclick="exportExcelExpenses()" style="padding:10px 14px;background:#16a34a;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;font-family:Arial;">📊 Export Excel</button>
    <button onclick="sendEmailExpenses()" style="padding:10px 14px;background:#0891b2;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;font-family:Arial;">✉️ Email</button>
    <button onclick="location.href='rapport-comptable.html'" style="padding:10px 14px;background:#1e40af;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;font-family:Arial;">📊 Rapport Comptable</button>
    <button class="home-btn" onclick="location.href='index.html'">🏠 Accueil</button>
  </div>
</div>

<div class="container">
  <div>
    <div class="card">
      <h3>➕ Ajouter une dépense</h3>
      <div class="role-notice" id="roleNotice">
        👤 Vendeur — Vous pouvez uniquement saisir certaines catégories de dépenses.
      </div>
      <div class="fg"><label>Date</label><input type="date" id="dep_date"></div>
      <div class="fg"><label>Description</label><input id="dep_desc" placeholder="Ex: Achat café, produit entretien..."></div>
      <div class="fg"><label>Montant (€)</label><input type="number" id="dep_amount" placeholder="0.00" min="0" step="0.01"></div>
      <div class="fg"><label>Catégorie</label>
        <select id="dep_cat"></select>
      </div>
      <button class="btn-add" onclick="addExpense()">✅ Enregistrer la dépense</button>
    </div>
    <div class="card" style="margin-top:20px">
      <h3>📊 Résumé par catégorie</h3>
      <div id="summaryByCat"></div>
    </div>
  </div>

  <div class="card">
    <h3>📋 Liste des dépenses</h3>
    <div class="filters no-print">
      <input type="date" id="f_from" onchange="loadExpenses()">
      <input type="date" id="f_to"   onchange="loadExpenses()">
      <select id="f_cat" onchange="loadExpenses()">
        <option value="">Toutes catégories</option>
      </select>
    </div>
    <table>
      <thead><tr><th>Date</th><th>Description</th><th>Catégorie</th><th>Montant</th><th class="no-print"></th></tr></thead>
      <tbody id="expBody"></tbody>
    </table>
    <div class="total-bar"><span>TOTAL PÉRIODE</span><span id="totalExp">0.00 €</span></div>
  </div>
</div>

<script>
var currentUser = requireAuth('expenses-limited');
var userRole = currentUser ? currentUser.role : 'vendeur';
var allowedCategories = [];

const fmt = n => Number(n||0).toFixed(2) + ' €';
const today    = new Date().toISOString().slice(0,10);
const firstDay = today.slice(0,8) + '01';
document.getElementById('dep_date').value = today;
document.getElementById('f_from').value   = firstDay;
document.getElementById('f_to').value     = today;

/* Charger les catégories autorisées selon le rôle */
async function loadCategories() {
  try {
    /* Charger uniquement les catégories autorisées pour ce rôle */
    var res  = await fetch('/api/expense-categories?role=' + userRole);
    allowedCategories = await res.json();

    /* Afficher notice si vendeur */
    if (userRole !== 'gerant') {
      document.getElementById('roleNotice').style.display = 'block';
    }

    /* Remplir le select du formulaire */
    var depCat = document.getElementById('dep_cat');
    depCat.innerHTML = allowedCategories.map(function(cat) {
      return '<option value="' + cat + '">' + cat + '</option>';
    }).join('');

    /* Remplir le filtre */
    var fCat = document.getElementById('f_cat');
    fCat.innerHTML = '<option value="">Toutes catégories</option>' +
      allowedCategories.map(function(cat) {
        return '<option value="' + cat + '">' + cat + '</option>';
      }).join('');

  } catch(e) {
    console.error('Erreur chargement catégories:', e);
  }
}

async function addExpense() {
  var desc   = document.getElementById('dep_desc').value.trim();
  var amount = Number(document.getElementById('dep_amount').value);
  var cat    = document.getElementById('dep_cat').value;
  var date   = document.getElementById('dep_date').value;

  if (!desc || !amount) { alert('⚠️ Description et montant obligatoires'); return; }

  /* Vérification sécurité côté client */
  if (userRole !== 'gerant' && allowedCategories.indexOf(cat) < 0) {
    alert('❌ Catégorie non autorisée');
    return;
  }

  var res = await fetch('/api/expenses', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({description:desc, amount, category:cat, date})
  });
  var d = await res.json();
  if (d.error) { alert('❌ ' + d.error); return; }
  document.getElementById('dep_desc').value   = '';
  document.getElementById('dep_amount').value = '';
  loadExpenses();
}

async function loadExpenses() {
  var from = document.getElementById('f_from').value;
  var to   = document.getElementById('f_to').value;
  var cat  = document.getElementById('f_cat').value;

  /* Le vendeur ne voit que ses catégories autorisées */
  var url = '/api/expenses?from=' + from + '&to=' + to;
  if (cat) url += '&category=' + encodeURIComponent(cat);

  var res  = await fetch(url);
  var data = await res.json();

  /* Filtrer côté client si vendeur */
  if (userRole !== 'gerant' && allowedCategories.length > 0) {
    data = data.filter(function(e) {
      return allowedCategories.indexOf(e.category) >= 0;
    });
  }

  var tbody = document.getElementById('expBody');
  var total = 0;
  var byCat = {};

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">Aucune dépense sur cette période</td></tr>';
  } else {
    tbody.innerHTML = data.map(function(e) {
      total += Number(e.amount||0);
      byCat[e.category] = (byCat[e.category]||0) + Number(e.amount||0);
      return '<tr>' +
        '<td>' + new Date(e.date).toLocaleDateString('fr-FR') + '</td>' +
        '<td><b>' + e.description + '</b></td>' +
        '<td><span class="cat-badge">' + (e.category||'Autre') + '</span></td>' +
        '<td style="font-weight:bold;color:#dc2626">' + fmt(e.amount) + '</td>' +
        '<td class="no-print">' +
          (userRole === 'gerant' ? '<button class="del-btn" onclick="deleteExpense(' + e.id + ')">🗑</button>' : '') +
        '</td>' +
        '</tr>';
    }).join('');
  }

  document.getElementById('totalExp').textContent = fmt(total);

  /* Résumé par catégorie */
  var sumDiv = document.getElementById('summaryByCat');
  var entries = Object.entries(byCat);
  if (!entries.length) {
    sumDiv.innerHTML = '<p style="color:#94a3b8;font-size:13px">Aucune dépense</p>';
  } else {
    sumDiv.innerHTML = entries.sort(function(a,b){ return b[1]-a[1]; }).map(function(entry) {
      var cat = entry[0]; var amt = entry[1];
      var pct = total > 0 ? Math.round(amt/total*100) : 0;
      return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
        '<span class="cat-badge" style="min-width:90px">' + cat + '</span>' +
        '<div style="flex:1;margin:0 12px;height:8px;background:#f1f5f9;border-radius:4px">' +
        '<div style="width:' + pct + '%;height:100%;background:#ef4444;border-radius:4px"></div></div>' +
        '<span style="font-weight:bold;font-size:13px;min-width:80px;text-align:right">' + fmt(amt) + '</span>' +
        '</div>';
    }).join('');
  }
}

async function deleteExpense(id) {
  if (userRole !== 'gerant') { alert('❌ Action réservée au gérant'); return; }
  if (!confirm('Supprimer cette dépense ?')) return;
  await fetch('/api/expenses/'+id, {method:'DELETE'});
  loadExpenses();
}

/* Init */

/* ══ EXPORT EXCEL DÉPENSES ══ */
function exportExcelExpenses() {
  var from = document.getElementById('f_from').value;
  var to   = document.getElementById('f_to').value;
  var rows = [];
  var trs  = document.querySelectorAll('#expBody tr');
  trs.forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 4) {
      rows.push([tds[0].textContent.trim(), tds[1].textContent.trim(), tds[2].textContent.trim(), tds[3].textContent.trim().replace(' €','')]);
    }
  });
  if (!rows.length) { alert('Aucune dépense à exporter'); return; }
  var csv = 'Date,Description,Categorie,Montant\n';
  rows.forEach(function(r){ csv += r.map(function(v){ return '"'+v+'"'; }).join(',') + '\n'; });
  csv += '"TOTAL","","","' + document.getElementById('totalExp').textContent.replace(' €','') + '"\n';
  var blob = new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8;'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'depenses-' + (from||'periode') + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* ══ EMAIL DÉPENSES ══ */
function sendEmailExpenses() {
  var from  = document.getElementById('f_from').value;
  var to    = document.getElementById('f_to').value;
  var total = document.getElementById('totalExp').textContent;
  var trs   = document.querySelectorAll('#expBody tr');
  var lines = [];
  trs.forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 4) lines.push(tds[0].textContent.trim() + ' | ' + tds[1].textContent.trim() + ' | ' + tds[2].textContent.trim() + ' | ' + tds[3].textContent.trim());
  });
  if (!lines.length) { alert('Aucune dépense à envoyer'); return; }
  var subject  = encodeURIComponent('Depenses - The SMARTPHONE - ' + (from||'') + ' au ' + (to||''));
  var bodyText = 'Rapport des depenses - The SMARTPHONE\n' +
    'Periode : ' + (from||'—') + ' au ' + (to||'—') + '\n\n' +
    lines.join('\n') + '\n\nTOTAL : ' + total +
    '\n\nThe SMARTPHONE\n1 Avenue d\'Italie, 75013 Paris';
  var email = prompt('Email destinataire :') || '';
  if (!email) return;
  window.open('mailto:' + email + '?subject=' + subject + '&body=' + encodeURIComponent(bodyText));
}

loadCategories().then(function(){ loadExpenses(); });
</script>
</body>
</html>
