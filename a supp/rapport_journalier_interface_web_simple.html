<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rapport Journalier</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    .total { font-weight: bold; }
    button { padding: 10px 15px; margin-top: 10px; }
    .box { margin-bottom: 20px; }
  </style>
</head>
<body>

<h1>Rapport de fin de journée</h1>

<p id="status">Chargement des données...</p>

<!-- TABLE 2: Totaux paiement -->
<h2>Totaux par mode de paiement</h2>
<table>
  <tr><td>Total CB</td><td id="totalCB">0 €</td></tr>
  <tr><td>Total Espèces</td><td id="totalCash">0 €</td></tr>
  <tr class="total"><td>Total Ventes + Réparations</td><td id="totalGlobal">0 €</td></tr>
</table>

<!-- TABLE 3: Dépenses -->
<h2>Dépenses</h2>
<table>
  <tr>
    <th>Total Dépenses</th>
    <th id="totalExpenses">0 €</th>
  </tr>
</table>

<!-- RESULTAT -->
<h2>Résultat Net</h2>
<p class="total" id="netResult">0 €</p>

<button onclick="window.print()">🖨 Imprimer</button>
<button onclick="fetchReport()">🔄 Rafraîchir</button>

<script>

const API_URL = "http://localhost:3000/api/report";

async function fetchReport() {
  try {
    document.getElementById("status").innerText = "Chargement...";

    const response = await fetch(API_URL);
    const data = await response.json();

    document.getElementById("totalCB").innerText = data.cb + " €";
    document.getElementById("totalCash").innerText = data.cash + " €";
    document.getElementById("totalGlobal").innerText = data.total + " €";
    document.getElementById("totalExpenses").innerText = data.expenses + " €";
    document.getElementById("netResult").innerText = data.net + " €";

    document.getElementById("status").innerText = "Données à jour ✔";

  } catch (error) {
    console.error(error);
    document.getElementById("status").innerText = "Erreur de connexion API ❌";
  }
}

// Chargement automatique
fetchReport();

</script>

</body>
</html>
