<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rapport Comptable — The SMARTPHONE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f3f4f6;padding:20px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.toolbar input[type=date]{padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
button{padding:10px 18px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;margin-left:6px;background:#333;color:white;}
#document{max-width:700px;margin:0 auto;background:white;padding:28px;box-shadow:0 2px 8px #0001;}
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px;}
.shop{font-size:16px;font-weight:900;}
.shop-info{font-size:10px;color:#333;margin-top:3px;line-height:1.6;}
.doc-right{text-align:right;}
.doc-title{font-size:13px;font-weight:900;text-transform:uppercase;}
.doc-date{font-size:11px;margin-top:3px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{border:1px solid #000;padding:5px 8px;text-align:left;font-weight:bold;background:#fff;color:#000;}
th.right{text-align:right;}
td{border:1px solid #ccc;padding:5px 8px;}
td.right{text-align:right;}
td.center{text-align:center;}
tfoot td{border:1px solid #000;font-weight:bold;}
tfoot td.right{text-align:right;}
tfoot tr.grand td{border:2px solid #000;font-size:13px;}
.totals-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
.totals-table td{padding:5px 8px;border:1px solid #000;}
.totals-table .lbl{font-weight:bold;}
.totals-table .val{text-align:right;font-weight:bold;}
.totals-table .grand td{font-size:14px;font-weight:900;border:2px solid #000;}
.printed-info{font-size:9px;color:#aaa;text-align:right;margin-top:10px;}
@media print{
  body{background:white;padding:0;}
  .toolbar{display:none!important;}
  #document{box-shadow:none;padding:16px;}
}
</style>
</head>
<body>

<div class="toolbar">
  <div>
    <input type="date" id="datePicker">
    <button onclick="loadRapport()">🔎 Générer</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;">
    <button onclick="window.print()" style="background:#475569;">🖨️ Imprimer</button>
    <button onclick="savePDF()" style="background:#7c3aed;">💾 Enregistrer PDF</button>
    <button onclick="exportExcelRapport()" style="background:#16a34a;">📊 Export Excel</button>
    <button onclick="sendEmailRapport()" style="background:#0891b2;">✉️ Email</button>
    <button onclick="sendWhatsAppRapport()" style="background:#25d366;">💬 WhatsApp</button>
    <button onclick="location.href='index.html'" style="background:#1e40af;">🏠 Accueil</button>
  </div>
</div>

<div id="document">
  <div style="text-align:center;color:#999;padding:40px;font-size:14px" id="placeholder">
    Sélectionnez une date et cliquez sur 🔎 Générer
  </div>
  <div id="content" style="display:none"></div>
</div>

<script>
const fmt = n => Number(n||0).toFixed(2) + ' €';
document.getElementById('datePicker').value = new Date().toISOString().slice(0,10);

function dateLabel(ds){
  return new Date(ds+'T00:00:00').toLocaleDateString('fr-FR',
    {weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

async function loadRapport(){
  const date=document.getElementById('datePicker').value;
  document.getElementById('placeholder').style.display='block';
  document.getElementById('placeholder').textContent='⏳ Chargement...';
  document.getElementById('content').style.display='none';
  try{
    /* Utilise la nouvelle route /api/rapport-comptable */
    const res=await fetch('/api/rapport-comptable?date='+date);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    renderRapport(date,data);
  }catch(e){
    document.getElementById('placeholder').textContent='❌ Erreur : '+e.message;
  }
}

function renderRapport(date,data){
  const t=data.totaux;
  const totalCA  =(t.total_ventes||0)+(t.total_reps||0);
  const netCaisse=totalCA-(t.total_dep||0);

  /* Lignes ventes — chaque order_item avec son vrai montant */
  const rowsVentes=data.ventes.length===0
    ?`<tr><td colspan="5" style="text-align:center;color:#999;padding:12px">Aucune vente encaissée</td></tr>`
    :data.ventes.map(l=>`<tr>
        <td>${l.nom}</td>
        <td>${l.fournisseur}</td>
        <td class="center">${l.qty}</td>
        <td class="center">Vente</td>
        <td class="right">${fmt(l.total_ligne)}</td>
      </tr>`).join('');

  /* Lignes réparations */
  const rowsReps=data.reps.length===0
    ?`<tr><td colspan="5" style="text-align:center;color:#999;padding:12px">Aucune réparation ce jour</td></tr>`
    :data.reps.map(l=>`<tr>
        <td>${l.nom||'Réparation'}</td>
        <td>${l.fournisseur}</td>
        <td class="center">${l.qty}</td>
        <td class="center">Réparation</td>
        <td class="right">${fmt(l.total_ligne)}</td>
      </tr>`).join('');

  document.getElementById('placeholder').style.display='none';
  document.getElementById('content').style.display='block';
  document.getElementById('content').innerHTML=`

    <div class="doc-header">
      <div>
        <div class="shop">The SMARTPHONE</div>
        <div class="shop-info">
          1 Avenue d'Italie, 75013 Paris<br>
          01 47 07 18 66 &nbsp;|&nbsp; smartphonesatelier4@gmail.com
        </div>
      </div>
      <div class="doc-right">
        <div class="doc-title">Rapport CA</div>
        <div class="doc-date">${date.split('-').reverse().join('/')}</div>
        <div class="doc-date">${dateLabel(date)}</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Fournisseur</th>
          <th class="right">Quantité</th>
          <th>Type</th>
          <th class="right">CA</th>
        </tr>
      </thead>
      <tbody>
        ${rowsVentes}
        ${rowsReps}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4" style="font-weight:bold">Total Ventes</td>
          <td class="right">${fmt(t.total_ventes)}</td>
        </tr>
        <tr>
          <td colspan="4" style="font-weight:bold">Total Réparations</td>
          <td class="right">${fmt(t.total_reps)}</td>
        </tr>
        <tr class="grand">
          <td colspan="4" style="font-weight:900">Total CA</td>
          <td class="right" style="font-size:14px;font-weight:900">${fmt(totalCA)}</td>
        </tr>
      </tfoot>
    </table>

    <table class="totals-table" style="margin-top:10px">
      <tr><td class="lbl">CB</td><td class="val">${fmt(t.total_cb)}</td></tr>
      <tr><td class="lbl">Espèces (ES)</td><td class="val">${fmt(t.total_esp)}</td></tr>
      <tr><td class="lbl">Dépenses (DP)</td><td class="val">− ${fmt(t.total_dep)}</td></tr>
      <tr class="grand"><td class="lbl">Net Caisse</td><td class="val">${fmt(netCaisse)}</td></tr>
    </table>

    <div class="printed-info">Généré le ${new Date().toLocaleString('fr-FR')}</div>
  `;
}

loadRapport();

/* ══ ENREGISTRER PDF ══ */
function savePDF() {
  var content = document.getElementById('content');
  if (!content || content.style.display === 'none') { alert('Generez d abord le rapport'); return; }
  alert('Dans la boite d impression qui va s ouvrir:\n\n1. Choisissez "Enregistrer en PDF" comme imprimante\n2. Cliquez sur Enregistrer');
  window.print();
}

/* ══ EXPORT EXCEL ══ */
function exportExcelRapport() {
  var content = document.getElementById('content');
  if (!content || content.style.display === 'none') { alert('Generez d abord le rapport'); return; }
  var date = document.getElementById('datePicker').value;
  var rows = [['Nom','Fournisseur','Qte','Type','CA (EUR)']];

  content.querySelectorAll('tbody tr').forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 5) {
      rows.push([
        tds[0].textContent.trim(),
        tds[1].textContent.trim(),
        tds[2].textContent.trim(),
        tds[3].textContent.trim(),
        tds[4].textContent.trim().replace(' EUR','').replace(' €','').replace(',','.')
      ]);
    }
  });

  rows.push([]);
  content.querySelectorAll('tfoot tr').forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 2) {
      rows.push([tds[0].textContent.trim(),'','','',
        tds[tds.length-1].textContent.trim().replace(' EUR','').replace(' €','')]);
    }
  });

  rows.push([]);
  rows.push(['RECAP PAIEMENTS','','','','']);
  content.querySelectorAll('.totals-table tr').forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 2) {
      rows.push([tds[0].textContent.trim(),'','','',
        tds[1].textContent.trim().replace(' EUR','').replace(' €','')]);
    }
  });

  /* Délimiteur point-virgule = standard Excel français */
  var csv = rows.map(function(r){
    return r.map(function(v){ return (v||'').toString().replace(/;/g,' '); }).join(';');
  }).join('\n');

  var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = 'rapport-comptable-' + date + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

/* ══ EMAIL ══ */
function sendEmailRapport() {
  var content = document.getElementById('content');
  if (!content || content.style.display === 'none') { alert('Generez d abord le rapport'); return; }
  var date  = document.getElementById('datePicker').value;
  var dl    = new Date(date+'T00:00:00').toLocaleDateString('fr-FR',
    {weekday:'long', year:'numeric', month:'long', day:'numeric'});

  /* Collecter les données */
  var lignes = [];
  content.querySelectorAll('tbody tr').forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 5) {
      lignes.push(tds[0].textContent.trim() + ' | ' + tds[3].textContent.trim() + ' | ' + tds[4].textContent.trim());
    }
  });

  var totals = [];
  content.querySelectorAll('tfoot tr').forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 2) totals.push(tds[0].textContent.trim() + ' : ' + tds[tds.length-1].textContent.trim());
  });

  var recap = [];
  content.querySelectorAll('.totals-table tr').forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 2) recap.push(tds[0].textContent.trim() + ' : ' + tds[1].textContent.trim());
  });

  var subject = encodeURIComponent('Rapport Comptable - The SMARTPHONE - ' + date);
  var bodyText = 'Rapport Comptable - The SMARTPHONE\n' +
    dl + '\n\n' +
    '=== DETAIL ===\n' + lignes.join('\n') + '\n\n' +
    '=== TOTAUX ===\n' + totals.join('\n') + '\n\n' +
    '=== RECAP PAIEMENTS ===\n' + recap.join('\n') + '\n\n' +
    'The SMARTPHONE\n1 Avenue d\'Italie, 75013 Paris\n01 47 07 18 66';

  var email = prompt('Email destinataire :') || '';
  if (!email) return;
  window.open('mailto:' + email + '?subject=' + subject + '&body=' + encodeURIComponent(bodyText));
}

/* ══ WHATSAPP ══ */
function sendWhatsAppRapport() {
  var content = document.getElementById('content');
  if (!content || content.style.display === 'none') { alert('Generez d abord le rapport'); return; }
  var date = document.getElementById('datePicker').value;
  var dl   = new Date(date+'T00:00:00').toLocaleDateString('fr-FR',
    {weekday:'long', year:'numeric', month:'long', day:'numeric'});

  var totals = [];
  content.querySelectorAll('tfoot tr').forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 2) totals.push(tds[0].textContent.trim() + ' : ' + tds[tds.length-1].textContent.trim());
  });

  var recap = [];
  content.querySelectorAll('.totals-table tr').forEach(function(tr) {
    var tds = tr.querySelectorAll('td');
    if (tds.length >= 2) recap.push(tds[0].textContent.trim() + ' : ' + tds[1].textContent.trim());
  });

  var msg = 'Rapport Comptable - The SMARTPHONE%0A' +
    dl + '%0A%0A' +
    totals.map(function(t){ return t; }).join('%0A') + '%0A%0A' +
    recap.map(function(r){ return r; }).join('%0A');

  window.open('https://wa.me/?text=' + msg, '_blank');
}

</script>
</body>
</html>
