<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The SMARTPHONE — Connexion</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;}

.login-wrap{width:100%;max-width:420px;padding:20px;}

/* Header */
.login-header{text-align:center;margin-bottom:32px;}
.login-header .logo{font-size:52px;margin-bottom:10px;}
.login-header h1{margin:0 0 4px;font-size:24px;color:white;}
.login-header p{margin:0;color:#64748b;font-size:13px;}

/* Sélection utilisateur */
.users-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.user-card{background:#1e293b;border:2px solid #334155;border-radius:12px;padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:0.15s;}
.user-card:hover{border-color:#3b82f6;background:#1e3a8a22;}
.user-card.selected{border-color:#22c55e;background:#166534 22;}
.user-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.av-gerant{background:#1e40af;}
.av-vendeur{background:#334155;}
.user-info .un{font-size:14px;font-weight:bold;color:white;}
.user-info .ur{font-size:11px;color:#64748b;margin-top:2px;}
.user-badge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:bold;}
.badge-gerant{background:#1e40af;color:#93c5fd;}
.badge-vendeur{background:#334155;color:#94a3b8;}

/* Zone auth */
.auth-box{background:#1e293b;border-radius:14px;padding:20px;display:none;}
.auth-box.show{display:block;}
.auth-title{font-size:13px;color:#94a3b8;margin-bottom:16px;text-align:center;}

/* Clavier PIN */
.pin-display{display:flex;justify-content:center;gap:10px;margin-bottom:20px;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:#334155;transition:0.2s;}
.pin-dot.filled{background:#22c55e;}

.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;}
.pin-btn{padding:16px;background:#0f172a;color:white;border:1.5px solid #334155;border-radius:10px;font-size:20px;font-weight:bold;cursor:pointer;text-align:center;transition:0.1s;font-family:Arial;}
.pin-btn:hover{background:#1e293b;border-color:#3b82f6;}
.pin-btn:active{transform:scale(0.95);}
.pin-btn.del{background:#7f1d1d;border-color:#ef4444;color:#fca5a5;font-size:16px;}
.pin-btn.zero{grid-column:2;}

/* Mot de passe */
.pwd-field{width:100%;padding:14px;background:#0f172a;border:1.5px solid #334155;border-radius:8px;font-size:16px;color:white;font-family:Arial;text-align:center;letter-spacing:4px;margin-bottom:14px;}
.pwd-field:focus{outline:none;border-color:#3b82f6;}
.btn-login{width:100%;padding:14px;background:#22c55e;color:white;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;font-family:Arial;}
.btn-login:hover{background:#16a34a;}

/* Erreur */
.auth-error{background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px;text-align:center;font-size:13px;margin-top:10px;display:none;}

/* Toggle auth type */
.toggle-auth{text-align:center;margin-top:12px;}
.toggle-link{color:#3b82f6;font-size:12px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-header">
    <div class="logo">📱</div>
    <h1>The SMARTPHONE</h1>
    <p>1 Avenue d'Italie, 75013 Paris</p>
  </div>

  <!-- LISTE UTILISATEURS -->
  <div class="users-grid" id="usersList">
    <div style="text-align:center;color:#475569;font-size:13px">Chargement...</div>
  </div>

  <!-- ZONE AUTH -->
  <div class="auth-box" id="authBox">
    <div class="auth-title" id="authTitle">Entrez votre PIN</div>

    <!-- PIN -->
    <div id="pinSection">
      <div class="pin-display" id="pinDisplay"></div>
      <div class="pin-grid">
        <button class="pin-btn" onclick="pinPress('1')">1</button>
        <button class="pin-btn" onclick="pinPress('2')">2</button>
        <button class="pin-btn" onclick="pinPress('3')">3</button>
        <button class="pin-btn" onclick="pinPress('4')">4</button>
        <button class="pin-btn" onclick="pinPress('5')">5</button>
        <button class="pin-btn" onclick="pinPress('6')">6</button>
        <button class="pin-btn" onclick="pinPress('7')">7</button>
        <button class="pin-btn" onclick="pinPress('8')">8</button>
        <button class="pin-btn" onclick="pinPress('9')">9</button>
        <button class="pin-btn del" onclick="pinDel()">⌫</button>
        <button class="pin-btn zero" onclick="pinPress('0')">0</button>
      </div>
    </div>

    <!-- MOT DE PASSE -->
    <div id="pwdSection" style="display:none">
      <input type="password" class="pwd-field" id="pwdInput" placeholder="Mot de passe" maxlength="50">
      <button class="btn-login" onclick="loginWithPwd()">Se connecter</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <div class="toggle-auth">
      <span class="toggle-link" id="toggleLink" onclick="toggleAuthType()">Utiliser le mot de passe</span>
    </div>
  </div>
</div>

<script>
var users = [];
var selectedUser = null;
var currentPin = '';
var showingPwd = false;

/* ── INIT ── */
async function init() {
  try {
    var res  = await fetch('/api/users');
    users = await res.json();
    renderUsers();
  } catch(e) {
    document.getElementById('usersList').innerHTML =
      '<div style="color:#ef4444;text-align:center;font-size:13px">Erreur chargement — serveur démarré ?</div>';
  }
}

function renderUsers() {
  var grid = document.getElementById('usersList');
  if (!users.length) {
    grid.innerHTML = '<div style="color:#ef4444;text-align:center">Aucun utilisateur — exécutez create_users.sql</div>';
    return;
  }
  grid.innerHTML = users.map(function(u) {
    var avCls    = u.role === 'gerant' ? 'av-gerant' : 'av-vendeur';
    var badgeCls = u.role === 'gerant' ? 'badge-gerant' : 'badge-vendeur';
    var icon     = u.role === 'gerant' ? '👑' : '👤';
    var roleLabel= u.role === 'gerant' ? 'Gérant' : 'Vendeur';
    return '<div class="user-card" data-id="' + u.id + '" onclick="selectUser(' + u.id + ')">' +
      '<div class="user-avatar ' + avCls + '">' + icon + '</div>' +
      '<div class="user-info">' +
      '<div class="un">' + u.name + '</div>' +
      '<div class="ur">' + (u.auth_type === 'pin' ? '🔢 PIN 4 chiffres' : '🔑 Mot de passe') + '</div>' +
      '</div>' +
      '<span class="user-badge ' + badgeCls + '">' + roleLabel + '</span>' +
      '</div>';
  }).join('');
}

function selectUser(id) {
  selectedUser = users.find(function(u){ return u.id === id; });
  if (!selectedUser) return;

  /* Highlight */
  document.querySelectorAll('.user-card').forEach(function(c){ c.classList.remove('selected'); });
  document.querySelector('[data-id="' + id + '"]').classList.add('selected');

  /* Afficher la zone auth */
  var authBox = document.getElementById('authBox');
  authBox.classList.add('show');
  document.getElementById('authTitle').textContent =
    'Bonjour ' + selectedUser.name + ' — ' +
    (selectedUser.auth_type === 'pin' ? 'Entrez votre PIN' : 'Entrez votre mot de passe');

  /* Afficher le bon mode */
  showingPwd = selectedUser.auth_type === 'password';
  updateAuthDisplay();
  currentPin = '';
  updatePinDisplay();

  if (showingPwd) {
    setTimeout(function(){ document.getElementById('pwdInput').focus(); }, 100);
  }
}

function updateAuthDisplay() {
  document.getElementById('pinSection').style.display = showingPwd ? 'none' : 'block';
  document.getElementById('pwdSection').style.display = showingPwd ? 'block' : 'none';
  document.getElementById('toggleLink').textContent   =
    showingPwd ? 'Utiliser le PIN' : 'Utiliser le mot de passe';
}

function toggleAuthType() {
  showingPwd = !showingPwd;
  updateAuthDisplay();
  currentPin = '';
  updatePinDisplay();
  document.getElementById('authError').style.display = 'none';
}

/* ── PIN ── */
function pinPress(digit) {
  if (currentPin.length >= 4) return;
  currentPin += digit;
  updatePinDisplay();
  if (currentPin.length === 4) {
    setTimeout(login, 200);
  }
}

function pinDel() {
  currentPin = currentPin.slice(0, -1);
  updatePinDisplay();
}

function updatePinDisplay() {
  var dots = document.getElementById('pinDisplay');
  dots.innerHTML = '';
  for (var i = 0; i < 4; i++) {
    var dot = document.createElement('div');
    dot.className = 'pin-dot' + (i < currentPin.length ? ' filled' : '');
    dots.appendChild(dot);
  }
}

/* Clavier physique pour PIN */
document.addEventListener('keydown', function(e) {
  if (!selectedUser || showingPwd) return;
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  if (e.key === 'Backspace') pinDel();
});

/* ── CONNEXION ── */
async function login() {
  if (!selectedUser) return;
  var creds = showingPwd
    ? { type: 'password', value: document.getElementById('pwdInput').value }
    : { type: 'pin', value: currentPin };

  try {
    var res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: selectedUser.id, ...creds })
    });
    var d = await res.json();
    if (d.error) throw new Error(d.error);

    /* Stocker la session */
    sessionStorage.setItem('user', JSON.stringify({
      id:       d.user.id,
      name:     d.user.name,
      role:     d.user.role,
      loginAt:  Date.now()
    }));

    /* Rediriger vers l'accueil */
    window.location.href = 'index.html';
  } catch(e) {
    var err = document.getElementById('authError');
    err.style.display = 'block';
    err.textContent   = '❌ ' + (e.message === 'Invalid credentials' ? 'PIN ou mot de passe incorrect' : e.message);
    currentPin = '';
    updatePinDisplay();
    if (document.getElementById('pwdInput')) document.getElementById('pwdInput').value = '';
    /* Shake animation */
    var authBox = document.getElementById('authBox');
    authBox.style.animation = 'shake 0.4s';
    setTimeout(function(){ authBox.style.animation = ''; }, 400);
  }
}

function loginWithPwd() { login(); }

/* Shake CSS */
var style = document.createElement('style');
style.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}';
document.head.appendChild(style);

init();
</script>
</body>
</html>
