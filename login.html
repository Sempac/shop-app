<!DOCTYPE html>
<html>
<head>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/theme.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The SMARTPHONE — Connexion</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:Arial;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;}

.wrap{width:100%;max-width:400px;padding:20px;}

/* Header */
.header{text-align:center;margin-bottom:32px;}
.header .logo{font-size:56px;margin-bottom:10px;}
.header h1{margin:0 0 4px;font-size:26px;color:white;font-weight:900;}
.header p{margin:0;color:#475569;font-size:13px;}

/* Bouton sélection user */
.select-btn{width:100%;padding:16px;background:#1e293b;border:2px solid #334155;border-radius:12px;color:white;font-size:15px;font-weight:bold;cursor:pointer;font-family:Arial;display:flex;align-items:center;justify-content:space-between;transition:0.2s;margin-bottom:16px;}
.select-btn:hover{border-color:#3b82f6;}
.select-btn .arrow{font-size:18px;color:#64748b;transition:0.2s;}
.select-btn.open .arrow{transform:rotate(180deg);}

/* Dropdown utilisateurs */
.users-dropdown{background:#1e293b;border:1.5px solid #334155;border-radius:12px;overflow:hidden;margin-bottom:16px;display:none;}
.users-dropdown.show{display:block;}
.user-opt{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;border-bottom:1px solid #0f172a;transition:0.15s;}
.user-opt:last-child{border-bottom:none;}
.user-opt:hover{background:#0f172a;}
.user-opt.selected{background:#1e3a8a;}
.user-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;flex-shrink:0;}
.av-a{background:#5b21b6;color:#c4b5fd;}
.av-g{background:#1e40af;color:#93c5fd;}
.av-v{background:#334155;color:#94a3b8;}
.user-opt-name{font-size:14px;font-weight:bold;color:white;}

/* Zone auth */
.auth-zone{display:none;}
.auth-zone.show{display:block;}

/* Tabs PIN / Mot de passe */
.auth-tabs{display:flex;gap:0;margin-bottom:16px;background:#1e293b;border-radius:10px;padding:4px;}
.tab-btn{flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;font-family:Arial;background:transparent;color:#64748b;transition:0.2s;}
.tab-btn.active{background:#0f172a;color:white;}

/* PIN */
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px;}
.pin-dot{width:18px;height:18px;border-radius:50%;background:#334155;transition:0.2s;}
.pin-dot.filled{background:#22c55e;}

.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto 16px;}
.pin-btn{padding:18px;background:#1e293b;color:white;border:1.5px solid #334155;border-radius:10px;font-size:22px;font-weight:bold;cursor:pointer;text-align:center;transition:0.1s;font-family:Arial;}
.pin-btn:hover{background:#334155;border-color:#3b82f6;}
.pin-btn:active{transform:scale(0.94);}
.pin-btn.del{background:#1e293b;border-color:#334155;color:#94a3b8;font-size:16px;}
.pin-btn.zero{grid-column:2;}

/* Mot de passe */
.pwd-wrap{position:relative;margin-bottom:14px;}
.pwd-input{width:100%;padding:14px 44px 14px 16px;background:#1e293b;border:1.5px solid #334155;border-radius:10px;font-size:16px;color:white;font-family:Arial;letter-spacing:3px;}
.pwd-input:focus{outline:none;border-color:#3b82f6;}
.pwd-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#64748b;cursor:pointer;font-size:16px;padding:4px;}
.btn-login{width:100%;padding:14px;background:#22c55e;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;font-family:Arial;transition:0.2s;}
.btn-login:hover{background:#16a34a;}

/* Erreur */
.error-box{background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px 14px;text-align:center;font-size:13px;margin-top:10px;display:none;}

/* Animation shake */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake 0.4s;}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">📱</div>
    <h1>The SMARTPHONE</h1>
    <p>1 Avenue d'Italie, 75013 Paris</p>
  </div>

  <!-- SÉLECTION UTILISATEUR -->
  <button class="select-btn" id="selectBtn" onclick="toggleDropdown()">
    <span id="selectLabel">👤 Sélectionner un utilisateur</span>
    <span class="arrow">▼</span>
  </button>

  <div class="users-dropdown" id="usersDropdown"></div>

  <!-- ZONE AUTH -->
  <div class="auth-zone" id="authZone">

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabPin" onclick="switchTab('pin')">🔢 Code PIN</button>
      <button class="tab-btn" id="tabPwd" onclick="switchTab('pwd')">🔑 Mot de passe</button>
    </div>

    <!-- PIN -->
    <div id="pinSection">
      <div class="pin-dots" id="pinDots"></div>
      <div class="pin-grid">
        <button class="pin-btn" onclick="pinPress('1')">1</button>
        <button class="pin-btn" onclick="pinPress('2')">2</button>
        <button class="pin-btn" onclick="pinPress('3')">3</button>
        <button class="pin-btn" onclick="pinPress('4')">4</button>
        <button class="pin-btn" onclick="pinPress('5')">5</button>
        <button class="pin-btn" onclick="pinPress('6')">6</button>
        <button class="pin-btn" onclick="pinPress('7')">7</button>
        <button class="pin-btn" onclick="pinPress('8')">8</button>
        <button class="pin-btn" onclick="pinPress('9')">9</button>
        <button class="pin-btn del" onclick="pinDel()">⌫</button>
        <button class="pin-btn zero" onclick="pinPress('0')">0</button>
      </div>
    </div>

    <!-- MOT DE PASSE -->
    <div id="pwdSection" style="display:none;">
      <div class="pwd-wrap">
        <input type="password" class="pwd-input" id="pwdInput" placeholder="Mot de passe" maxlength="50">
        <button class="pwd-toggle" onclick="togglePwd()">👁</button>
      </div>
      <button class="btn-login" onclick="loginWithPwd()">Se connecter</button>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

</div>

<script>
var users = [];
var selectedUser = null;
var currentPin = '';
var currentTab = 'pin';
var dropdownOpen = false;
var pinLen = 4; /* longueur PIN selon le rôle : 4 vendeur, 6 admin/gérant */

/* ── INIT ── */
async function init() {
  try {
    var res = await fetch('/api/users');
    users   = await res.json();
    renderDropdown();
  } catch(e) {
    document.getElementById('selectLabel').textContent = 'Erreur chargement...';
  }
}

function roleIcon(role) {
  return role === 'admin' ? '👑' : role === 'gerant' ? '🔑' : '👤';
}
function roleAvClass(role) {
  return role === 'admin' ? 'av-a' : role === 'gerant' ? 'av-g' : 'av-v';
}
function rolePinLen(role) {
  return (role === 'admin' || role === 'gerant') ? 6 : 4;
}

function renderDropdown() {
  var dd = document.getElementById('usersDropdown');
  /* Admin d'abord, puis gérant, puis vendeur par nom */
  var order = {admin:0, gerant:1, vendeur:2};
  var sorted = users.slice().sort(function(a,b){
    var oa = order[a.role]||9, ob = order[b.role]||9;
    return oa !== ob ? oa - ob : a.name.localeCompare(b.name);
  });
  dd.innerHTML = sorted.map(function(u) {
    return '<div class="user-opt" onclick="selectUser(' + u.id + ')">' +
      '<div class="user-avatar ' + roleAvClass(u.role) + '">' + roleIcon(u.role) + '</div>' +
      '<div>' +
        '<div class="user-opt-name">' + u.name + '</div>' +
        '<div style="font-size:11px;color:#64748b;margin-top:1px;">' + (u.role==='admin'?'Administrateur':u.role==='gerant'?'Gérant':'Vendeur') + ' · PIN ' + rolePinLen(u.role) + ' chiffres</div>' +
      '</div>' +
      '</div>';
  }).join('');
}

function toggleDropdown() {
  dropdownOpen = !dropdownOpen;
  var dd  = document.getElementById('usersDropdown');
  var btn = document.getElementById('selectBtn');
  dd.classList.toggle('show', dropdownOpen);
  btn.classList.toggle('open', dropdownOpen);
}

function selectUser(id) {
  selectedUser = users.find(function(u){ return u.id === id; });
  if (!selectedUser) return;

  /* Mettre à jour le bouton */
  pinLen = rolePinLen(selectedUser.role);
  document.getElementById('selectLabel').textContent = roleIcon(selectedUser.role) + ' ' + selectedUser.name;

  /* Fermer dropdown */
  dropdownOpen = false;
  document.getElementById('usersDropdown').classList.remove('show');
  document.getElementById('selectBtn').classList.remove('open');

  /* Afficher zone auth */
  document.getElementById('authZone').classList.add('show');

  /* Reset */
  currentPin = '';
  updatePinDots();
  document.getElementById('pwdInput').value = '';
  document.getElementById('errorBox').style.display = 'none';
  switchTab('pin');
}

/* ── TABS ── */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('pinSection').style.display = tab === 'pin' ? 'block' : 'none';
  document.getElementById('pwdSection').style.display = tab === 'pwd' ? 'block' : 'none';
  document.getElementById('tabPin').className = 'tab-btn' + (tab === 'pin' ? ' active' : '');
  document.getElementById('tabPwd').className = 'tab-btn' + (tab === 'pwd' ? ' active' : '');
  currentPin = '';
  updatePinDots();
  document.getElementById('errorBox').style.display = 'none';
  if (tab === 'pwd') setTimeout(function(){ document.getElementById('pwdInput').focus(); }, 100);
}

/* ── PIN ── */
function pinPress(d) {
  if (!selectedUser) return;
  if (currentPin.length >= pinLen) return;
  currentPin += d;
  updatePinDots();
  if (currentPin.length === pinLen) setTimeout(login, 200);
}

function pinDel() {
  currentPin = currentPin.slice(0, -1);
  updatePinDots();
}

function updatePinDots() {
  var dots = document.getElementById('pinDots');
  dots.innerHTML = '';
  for (var i = 0; i < pinLen; i++) {
    var d = document.createElement('div');
    d.className = 'pin-dot' + (i < currentPin.length ? ' filled' : '');
    dots.appendChild(d);
  }
}

document.addEventListener('keydown', function(e) {
  if (!selectedUser || currentTab !== 'pin') return;
  if (e.key >= '0' && e.key <= '9') pinPress(e.key);
  if (e.key === 'Backspace') pinDel();
  if (e.key === 'Enter' && currentPin.length === pinLen) login();
});

/* ── MOT DE PASSE ── */
function togglePwd() {
  var inp = document.getElementById('pwdInput');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function loginWithPwd() { login(); }

document.getElementById('pwdInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') login();
});

/* ── CONNEXION ── */
async function login() {
  if (!selectedUser) return;
  var creds = currentTab === 'pin'
    ? { type: 'pin',      value: currentPin }
    : { type: 'password', value: document.getElementById('pwdInput').value };

  var err = document.getElementById('errorBox');
  err.style.display = 'none';

  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: selectedUser.id, type: creds.type, value: creds.value })
    });
    var d = await res.json();

    if (!res.ok) {
      err.style.display = 'block';
      err.style.background = '';
      err.style.color = '';
      if (d.blocked) {
        err.textContent = '🚫 Trop de tentatives. Réessayez dans ' + d.remaining + ' min.';
        err.style.background = '#1a0505';
        err.style.color = '#fca5a5';
      } else if (d.attempts_left !== undefined) {
        var left = d.attempts_left;
        if (left <= 0) {
          err.textContent = '❌ PIN incorrect — Dernière tentative avant blocage 15 min !';
          err.style.background = '#1a0505';
          err.style.color = '#fca5a5';
        } else {
          err.textContent = '❌ PIN incorrect — ' + left + ' essai' + (left > 1 ? 's' : '') + ' restant' + (left > 1 ? 's' : '');
        }
      } else {
        err.textContent = '❌ ' + (d.error || 'PIN incorrect');
      }
      currentPin = '';
      updatePinDots();
      document.getElementById('pwdInput').value = '';
      var az = document.getElementById('authZone');
      az.classList.add('shake');
      setTimeout(function(){ az.classList.remove('shake'); }, 400);
      return;
    }

    /* Succès — stocker la session */
    sessionStorage.setItem('user', JSON.stringify({
      id:      d.user.id,
      name:    d.user.name,
      role:    d.user.role,
      loginAt: Date.now()
    }));
    window.location.href = 'index.html';

  } catch(e) {
    err.style.display = 'block';
    err.textContent = '❌ Erreur réseau. Vérifiez la connexion.';
    currentPin = '';
    updatePinDots();
  }
}

init();
</script>
</body>
</html>
