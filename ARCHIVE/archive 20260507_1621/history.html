<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Historique ventes</title>

<style>

body{
  margin:0;
  font-family:Arial;
  display:flex;
  height:100vh;
}

/* LEFT PANEL */
.left{
  width:40%;
  background:#0f172a;
  color:white;
  padding:15px;
  overflow-y:auto;
}

input,select{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

/* BUTTONS */
.search-btn{ background:#3b82f6;color:white; }
.reset-btn{ background:#ef4444;color:white; }
.print-btn{ background:#22c55e;color:white; }
.daily-btn{ background:#10b981;color:white; }
.home-btn{ background:#111827;color:white; }

.item{
  background:#111827;
  padding:10px;
  margin-bottom:5px;
  cursor:pointer;
  border-radius:5px;
}

.item:hover{
  background:#1f2937;
}

/* RIGHT */
.right{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  border-bottom:1px solid #ddd;
  padding:8px;
}

.total{
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
}

.info{
  margin-bottom:20px;
  background:#f3f4f6;
  padding:15px;
}

</style>
</head>

<body>

<!-- LEFT -->
<div class="left">

<button class="home-btn"
onclick="location.href='index.html'">
🏠 Accueil
</button>

<h3>Recherche ventes</h3>

<input id="id" placeholder="ID vente">

<label>Date min</label>
<input id="date_min" type="date">

<label>Date max</label>
<input id="date_max" type="date">

<input id="min" placeholder="Total min">
<input id="max" placeholder="Total max">

<select id="payment">
<option value="">Tous paiements</option>
<option value="card">Carte bancaire</option>
<option value="cash">Espèces</option>
</select>

<input id="customer" placeholder="Client">

<button class="search-btn" onclick="searchOrders()">
🔎 Rechercher
</button>

<button class="reset-btn" onclick="resetFilters()">
♻ Réinitialiser
</button>

<button class="daily-btn" onclick="openDailyReport()">
📊 Caisse du jour
</button>

<div id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">

<h2>Détail vente</h2>

<div class="info" id="info">
Sélectionnez une vente
</div>

<button class="print-btn" onclick="printCurrent()">
🖨 Imprimer facture
</button>

<table>
<thead>
<tr>
<th>Produit</th>
<th>Qté</th>
<th>Prix</th>
<th>Remise</th>
<th>Total</th>
</tr>
</thead>

<tbody id="items"></tbody>
</table>

<div class="total" id="total"></div>

</div>

<script>

let current = null;

/* ================= RESET ================= */
function resetFilters(){

 document.getElementById("id").value="";
 document.getElementById("date_min").value="";
 document.getElementById("date_max").value="";
 document.getElementById("min").value="";
 document.getElementById("max").value="";
 document.getElementById("payment").value="";
 document.getElementById("customer").value="";

 document.getElementById("list").innerHTML="";
 document.getElementById("info").innerText="Sélectionnez une vente";
 document.getElementById("items").innerHTML="";
 document.getElementById("total").innerText="";
}

/* ================= SEARCH ================= */
async function searchOrders(){

 const params = new URLSearchParams();

 const id = document.getElementById("id").value.trim();
 const dateMin = document.getElementById("date_min").value;
 const dateMax = document.getElementById("date_max").value;
 const min = document.getElementById("min").value;
 const max = document.getElementById("max").value;
 const payment = document.getElementById("payment").value;
 const customer = document.getElementById("customer").value;

 if(id) params.append("id",id);
 if(dateMin) params.append("date_min",dateMin);
 if(dateMax) params.append("date_max",dateMax);
 if(min) params.append("min",min);
 if(max) params.append("max",max);
 if(payment) params.append("payment",payment);
 if(customer) params.append("customer",customer);

 const url = "/api/orders/search?" + params.toString();

 const res = await fetch(url);
 const data = await res.json();

 const list = document.getElementById("list");
 list.innerHTML="";

 if(!data.length){
   list.innerHTML="<p>Aucune vente</p>";
   return;
 }

 data.forEach(o=>{

   const div = document.createElement("div");
   div.className="item";

   div.innerHTML=`
   <b>#${o.id}</b><br>
   💳 ${o.payment_method}<br>
   💰 ${o.total} €<br>
   📅 ${new Date(o.created_at).toLocaleString()}
   `;

   div.onclick=()=>loadOrder(o.id);

   list.appendChild(div);
 });
}

/* ================= LOAD ================= */
async function loadOrder(id){

 const res = await fetch("/api/orders/"+id);
 const data = await res.json();

 current = data;

 document.getElementById("info").innerHTML=`
 <h3>Vente #${data.order.id}</h3>
 <p>💳 ${data.order.payment_method}</p>
 <p>📅 ${new Date(data.order.created_at).toLocaleString()}</p>
 `;

 let total=0;
 const tb=document.getElementById("items");
 tb.innerHTML="";

 data.items.forEach(i=>{

   const line=
   (i.price*i.quantity)-(i.discount*i.quantity);

   total+=line;

   tb.innerHTML+=`
   <tr>
   <td>${i.name}</td>
   <td>${i.quantity}</td>
   <td>${i.price}</td>
   <td>${i.discount}</td>
   <td>${line.toFixed(2)}</td>
   </tr>`;
 });

 document.getElementById("total").innerText=
 "TOTAL : "+total.toFixed(2)+" €";
}

/* ================= PRINT ================= */
function printCurrent(){

 if(!current){
   alert("Aucune vente sélectionnée");
   return;
 }

 let rows = "";

 current.items.forEach(i=>{

   const line =

   (Number(i.price) * Number(i.quantity))

   -

   (Number(i.discount) * Number(i.quantity));

   rows += `

   <tr>

     <td style="border:1px solid black;padding:8px;">
       ${i.name}
     </td>

     <td style="border:1px solid black;padding:8px;text-align:center;">
       ${i.quantity}
     </td>

     <td style="border:1px solid black;padding:8px;text-align:right;">
       ${Number(i.price).toFixed(2)} €
     </td>

     <td style="border:1px solid black;padding:8px;text-align:right;">
       ${Number(i.discount).toFixed(2)} €
     </td>

     <td style="border:1px solid black;padding:8px;text-align:right;">
       ${line.toFixed(2)} €
     </td>

   </tr>
   `;
 });

 const w = window.open("", "_blank");

 w.document.write(`

 <html>

 <head>

 <title>Facture</title>

 <style>

 body{
   font-family:Arial;
   padding:25px;
   color:black;
 }

 h2{
   margin-bottom:20px;
 }

 table{
   width:100%;
   border-collapse:collapse;
   margin-top:20px;
 }

 th{
   border:1px solid black;
   padding:8px;
   background:#e5e7eb;
   color:black;
   text-align:left;
 }

 td{
   border:1px solid black;
   padding:8px;
 }

 .info{
   margin-bottom:10px;
 }

 .total{
   margin-top:20px;
   font-size:22px;
   font-weight:bold;
   text-align:right;
 }

 </style>

 </head>

 <body>

 <h2>
 FACTURE
 </h2>

 <div class="info">
 <b>Numéro vente :</b>
 #${current.order.id}
 </div>

 <div class="info">
 <b>Client :</b>
 ${current.order.customer_name || 'CLIENT'}
 </div>

 <div class="info">
 <b>Moyen de paiement :</b>
 ${current.order.payment_method}
 </div>

 <div class="info">
 <b>Date :</b>
 ${new Date(current.order.created_at).toLocaleString()}
 </div>

 <table>

 <tr>

   <th>Produit</th>
   <th>Qté</th>
   <th>Prix</th>
   <th>Remise</th>
   <th>Total</th>

 </tr>

 ${rows}

 </table>

 <div class="total">

 TOTAL :
 ${Number(current.order.total).toFixed(2)} €

 </div>

 <script>
 window.onload = () => window.print();
 <\/script>

 </body>

 </html>

 `);

 w.document.close();
}
/* ================= DAILY REPORT ================= */
function openDailyReport(){
 window.open("dailyreport.html","_blank");
}

</script>

</body>
</html>
