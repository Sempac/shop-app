<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Caisse Pro</title>

<style>

body{
  margin:0;
  font-family:Arial;
  display:flex;
  height:100vh;
  background:#f1f5f9;
}

.left{
  width:40%;
  background:#0f172a;
  color:white;
  padding:15px;
  overflow:auto;
}

.right{
  flex:1;
  padding:20px;
  background:white;
  overflow:auto;
}

input,select{
  padding:10px;
  margin-bottom:8px;
  width:100%;
  box-sizing:border-box;
}

button{
  cursor:pointer;
}

.search-btn{
  background:#3b82f6;
  color:white;
  padding:10px;
  border:none;
}

#result button{
  width:100%;
  margin:5px 0;
  padding:10px;
  background:#10b981;
  color:white;
  border:none;
}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  padding:8px;
  border-bottom:1px solid #ddd;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
}

.pay{
  width:100%;
  padding:12px;
  background:#22c55e;
  color:white;
  border:none;
  margin-top:10px;
}

.topbtn{
  width:100%;
  padding:12px;
  background:#111827;
  color:white;
  border:none;
  margin-bottom:10px;
}

.print-box{
  margin-top:20px;
  padding:15px;
  background:#f1f5f9;
  border-radius:8px;
}

label{
  display:block;
  margin-bottom:10px;
}

</style>
</head>

<body>

<!-- LEFT -->
<div class="left">

<button class="topbtn"
onclick="location.href='index.html'">
🏠 Accueil
</button>

<h3>Produits</h3>

<input id="search"
placeholder="Nom ou code barre">

<button class="search-btn"
onclick="searchProduct()">
Rechercher
</button>

<div id="result"></div>

</div>

<!-- RIGHT -->
<div class="right">

<h2>Panier</h2>

<table>

<thead>
<tr>
<th>Produit</th>
<th>Prix</th>
<th>Qté</th>
<th>Remise</th>
<th></th>
</tr>
</thead>

<tbody id="cart"></tbody>

</table>

<div class="total"
id="total">
0
</div>

<h3>Client</h3>

<input id="customer"
placeholder="Nom client (optionnel)">

<h3>Paiement</h3>

<select id="payment">
<option value="card">💳 Carte bancaire</option>
<option value="cash">💵 Espèces</option>
</select>

<!-- PRINT -->
<div class="print-box">

<h3>Impression</h3>

<label>
<input type="checkbox"
id="print_ticket"
onclick="togglePrint('ticket')">

🧾 Ticket 80mm
</label>

<label>
<input type="checkbox"
id="print_invoice"
onclick="togglePrint('invoice')">

📄 Facture A4
</label>

</div>

<button class="pay"
onclick="checkout()">
VALIDER VENTE
</button>

</div>

<script>

let cart = [];
let printMode = null;

// ================= TOGGLE PRINT =================
function togglePrint(mode){

 if(printMode === mode){

   printMode = null;

   document.getElementById("print_ticket").checked = false;
   document.getElementById("print_invoice").checked = false;

   return;
 }

 document.getElementById("print_ticket").checked = false;
 document.getElementById("print_invoice").checked = false;

 printMode = mode;

 if(mode === "ticket"){
   document.getElementById("print_ticket").checked = true;
 }

 if(mode === "invoice"){
   document.getElementById("print_invoice").checked = true;
 }
}

// ================= SEARCH PRODUCT =================
async function searchProduct(){

 const v =
 document.getElementById("search")
 .value
 .toLowerCase();

 const r =
 await fetch("/api/products");

 const d =
 await r.json();

 const f = d.filter(p =>

   (p.name &&
    p.name.toLowerCase().includes(v))

   ||

   (p.barcode &&
    p.barcode.includes(v))
 );

 const div =
 document.getElementById("result");

 div.innerHTML = "";

 f.forEach(p=>{

   const b =
   document.createElement("button");

   b.innerText =
   `${p.name} - ${p.price}€`;

   b.onclick = () => add(p);

   div.appendChild(b);
 });
}

// ================= ADD =================
function add(p){

 let e =
 cart.find(x => x.id === p.id);

 if(e){

   e.qty++;

 } else {

   cart.push({

     id:p.id,
     name:p.name,
     price:Number(p.price),
     qty:1,
     discount:0
   });
 }

 render();
}

// ================= UPDATE DISCOUNT =================
function updateDiscount(i,val){

 cart[i].discount =
 Number(val) || 0;

 render();
}

// ================= REMOVE =================
function removeItem(i){

 cart.splice(i,1);

 render();
}

// ================= RENDER =================
function render(){

 let total = 0;

 const tb =
 document.getElementById("cart");

 tb.innerHTML = "";

 cart.forEach((c,i)=>{

   const line =
   (c.price*c.qty) -
   (c.discount*c.qty);

   total += line;

   tb.innerHTML += `

   <tr>

     <td>${c.name}</td>

     <td>${c.price}</td>

     <td>${c.qty}</td>

     <td>
       <input
       type="number"
       value="${c.discount}"
       onchange="updateDiscount(${i},this.value)">
     </td>

     <td>
       <button
       onclick="removeItem(${i})">
       X
       </button>
     </td>

   </tr>
   `;
 });

 document.getElementById("total")
 .innerText =
 total.toFixed(2) + " €";
}

// ================= CHECKOUT =================
async function checkout(){

 if(cart.length === 0){

   alert("Panier vide");
   return;
 }

 const payment =
 document.getElementById("payment").value;

 const customer =
 document.getElementById("customer").value;

 const r = await fetch("/api/orders",{

   method:"POST",

   headers:{
     "Content-Type":"application/json"
   },

   body:JSON.stringify({

     cart,
     payment,
     customer
   })
 });

 const d = await r.json();

 if(!d.success){

   alert("Erreur vente");
   return;
 }

 alert("Vente OK #" + d.orderId);

 if(printMode){
   await printOrder(d.orderId, printMode);
 }

 cart = [];

 render();

 document.getElementById("customer").value = "";
}

// ================= PRINT =================
async function printOrder(id,type){

 const r =
 await fetch("/api/orders/" + id);

 const data =
 await r.json();

 if(!data.order){

   alert("Erreur impression");
   return;
 }

 let rows = "";

 data.items.forEach(i=>{

   const line =

   (Number(i.price) *
    Number(i.quantity))

   -

   (Number(i.discount) *
    Number(i.quantity));

   rows += `

   <tr>

     <td>${i.name}</td>

     <td>${i.quantity}</td>

     <td>${i.price}</td>

     <td>${i.discount}</td>

     <td>${line.toFixed(2)}</td>

   </tr>
   `;
 });

 const w =
 window.open("", "_blank");

 if(type === "ticket"){

   w.document.write(`

   <html>

   <head>

   <style>

   @page{
     size:80mm auto;
     margin:5mm;
   }

   body{
     font-family:Arial;
     width:72mm;
     font-size:12px;
   }

   table{
     width:100%;
     border-collapse:collapse;
   }

   td,th{
     border-bottom:1px dashed #999;
     padding:4px;
     font-size:11px;
   }

   .center{
     text-align:center;
   }

   </style>

   </head>

   <body>

   <div class="center">

   <h2>CAISSE PRO</h2>

   <p>
   Vente #${data.order.id}
   </p>

   <p>
   ${new Date(data.order.created_at)
   .toLocaleString()}
   </p>

   <p>
   Client :
   ${data.order.customer_name || 'CLIENT'}
   </p>

   <p>
   Paiement :
   ${data.order.payment_method}
   </p>

   </div>

   <table>

   <tr>
   <th>Produit</th>
   <th>Qté</th>
   <th>Total</th>
   </tr>

   ${rows}

   </table>

   <h3 class="center">
   TOTAL :
   ${data.order.total} €
   </h3>

   <script>
   window.onload=()=>window.print();
   <\/script>

   </body>

   </html>
   `);

 } else {

   w.document.write(`

   <html>

   <head>

   <style>

   body{
     font-family:Arial;
     padding:30px;
   }

   table{
     width:100%;
     border-collapse:collapse;
     margin-top:20px;
   }

   td,th{
     border:1px solid #000;
     padding:8px;
   }

   .total{
     margin-top:20px;
     font-size:20px;
     font-weight:bold;
   }

   </style>

   </head>

   <body>

   <h2>FACTURE</h2>

   <p>
   Vente :
   #${data.order.id}
   </p>

   <p>
   Client :
   ${data.order.customer_name || 'CLIENT'}
   </p>

   <p>
   Paiement :
   ${data.order.payment_method}
   </p>

   <p>
   Date :
   ${new Date(data.order.created_at)
   .toLocaleString()}
   </p>

   <table>

   <tr>
   <th>Produit</th>
   <th>Qté</th>
   <th>Prix</th>
   <th>Remise</th>
   <th>Total</th>
   </tr>

   ${rows}

   </table>

   <div class="total">
   TOTAL :
   ${data.order.total} €
   </div>

   <script>
   window.onload=()=>window.print();
   <\/script>

   </body>

   </html>
   `);
 }

 w.document.close();
}

</script>

</body>
</html>
